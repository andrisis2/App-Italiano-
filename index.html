// ---------- FLASHCARDS ----------
function pickFlashTopic(){
  const stage = header('Flashcards');
  const allPool = DB.voci||[];
  const dueOf = pool => pool.filter(x=>isDue(x.id)).length;
  function mkRow(ico, label, desc, pool){
    const btn = rowTile(ico, label, `${desc} &middot; <span class="due">${dueOf(pool)} to review</span>`, ()=>navigateTo(()=>startTopicFlash(pool, label)));
    const wrap = $(`<div class="rowpair"></div>`);
    wrap.appendChild(btn);
    if(pool.length > 15){
      const q = $(`<button class="qbtn" type="button" title="Review 15 cards" aria-label="Review 15 cards of ${esc(label)}">${ic('zap')}<b>15</b>cards</button>`);
      q.onclick = ()=>navigateTo(()=>startQuick15(pool, label));
      wrap.appendChild(q);
    }
    return wrap;
  }
  stage.appendChild($(`<p class="sg-intro">Spaced repetition: a card you know comes back after 1 day, then 3, 7, 16… A card you miss comes back straight away. Nouns show their article.</p>`));
  stage.appendChild($(`<div class="sec-h" style="margin-top:0">By level</div>`));
  const levelList = $(`<div class="list"></div>`);
  const c1 = allPool.filter(v=>v.livello==='C1');
  const b2 = allPool.filter(v=>v.livello!=='C1');
  [['🎓','C1 words','Advanced vocabulary',c1],['🟢','B2 words','Solid everyday vocabulary',b2],['🎲','Mix','Every level together',allPool]].forEach(([e,l,d,p])=>{ if(p.length) levelList.appendChild(mkRow(e, l, `${d} &middot; ${p.length}`, p)); });
  stage.appendChild(levelList);
  stage.appendChild($(`<div class="sec-h">By topic</div>`));
  const list = $(`<div class="list"></div>`);
  topicList(allPool).forEach(([tag, label, words])=>list.appendChild(mkRow(TOPIC_ICONS[tag]||'📚', label, plur(words.length,'word','words'), words)));
  stage.appendChild(list);
}
function startTopicFlash(pool, label){ runFlash(pool, label, { restart: ()=>startTopicFlash(pool, label) }); }
function startQuick15(pool, label){ runFlash(pool, label + ' · 15 cards', { limit: 15, restart: ()=>startQuick15(pool, label) }); }
function flashDir(){ const d = localStorage.getItem('flashDir'); return d==='en-it' ? 'en-it' : 'it-en'; }

function flashCardEl(v, itFront){
  const g = genereDi(v);
  const itTxt = parolaConArticolo(v);
  const art = v.pos==='noun' && g && g!=='mf' ? articolo(v.it, g) : '';
  const itHtml = art ? `<span class="art${art.endsWith("'")?' el':''}">${esc(art)}</span>${art.endsWith("'")?'':' '}${esc(v.it)}` : esc(v.it);
  const gtag = v.pos==='noun' && g ? `<span class="gtag g${g==='mf'?'v':g}">${g==='m'?'m.':g==='f'?'f.':'m./f.'}</span>` : (v.pos==='verb' ? `<span class="gtag gv">verb</span>` : '');
  const spk = `<button class="speak" type="button" title="Listen" aria-label="Listen">${ic('vol')}</button>`;
  const szIt = `style="font-size:${fitSize(itTxt, 40, 24)}px"`, szEn = `style="font-size:${fitSize(v.en, 27, 18)}px"`;
  const flip = $(`
    <div class="flip" role="button" tabindex="0" aria-label="Flip the card">
      <div class="flash">
        <div class="face front">
          ${itFront ? gtag + spk : ''}
          ${itFront ? `<div class="it" ${szIt}>${itHtml}</div>` : `<div class="en" ${szEn}>${esc(v.en)}</div>`}
          <div class="hint">${ic('rotate')} tap to flip</div>
        </div>
        <div class="face back">
          ${!itFront ? gtag + spk : ''}
          ${itFront ? `<div class="en" ${szEn}>${esc(v.en)}</div><div class="small">${itHtml}</div>` : `<div class="it" ${szIt}>${itHtml}</div><div class="small">${esc(v.en)}</div>`}
          ${v.es ? `<div class="small" style="font-style:italic;font-weight:500">«${esc(v.es)}»</div>` : ''}
        </div>
      </div>
    </div>`);
  flip.querySelector(".speak").onclick = e=>{ e.stopPropagation(); speak(itTxt); };
  return {flip, itTxt};
}
function runFlash(pool, topicLabel, opts){
  opts = opts || {};
  let deck = opts.ignoreDue ? (pool||[]).slice() : (pool||[]).filter(c=>isDue(c.id));
  if(!deck.length && opts.fallbackAll) deck = shuffle((pool||[]).slice());
  deck = deck.sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  // never-seen cards all have the same urgency: shuffle them so it's not always the same ones
  const mai = shuffle(deck.filter(c=>dueScore(c.id)===Number.MAX_SAFE_INTEGER)), altre = deck.filter(c=>dueScore(c.id)!==Number.MAX_SAFE_INTEGER);
  deck = [...altre, ...mai];
  if(opts.limit) deck = deck.slice(0, opts.limit);
  const total = deck.length;
  let queue = deck.slice(), mastered = 0, sbagli = 0;
  let dir = flashDir();
  const stage = header(topicLabel || 'Flashcards', {narrow:true});
  if(!total){ emptyDone(stage, '✅', 'All reviewed!', "No cards due here for now. Come back when the interval is over, or pick another topic."); return; }
  const top = $(`<div class="ex-top"></div>`);
  const seg = $(`<div class="seg sm center"><button type="button" data-d="it-en">Italian → English</button><button type="button" data-d="en-it">English → Italian</button></div>`);
  const paintDir = ()=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.d===dir));
  seg.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ if(dir===b.dataset.d) return; dir = b.dataset.d; localStorage.setItem('flashDir', dir); paintDir(); show(); }; });
  paintDir();
  top.appendChild(seg);
  stage.appendChild(top);
  const bar = progressBar(top);
  const cardWrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(cardWrap);
  let c = null, flipped = false, flipFn = null, gradeFn = null;
  function advance(){
    if(!queue.length){
      flipFn = gradeFn = null;
      if(opts.onComplete) opts.onComplete();
      return finish(stage, `${mastered} / ${total + sbagli}`, opts.restart||(()=>runFlash(pool, topicLabel, opts)), {
        titolo: 'Flashcards done!',
        testo: sbagli ? `${plur(total,'card','cards')} reviewed, ${sbagli===1?'one went':sbagli+' went'} back into the deck.` : `${plur(total,'card','cards')}, all right first time.`
      });
    }
    c = queue.shift();
    show();
  }
  function show(){
    bar.style.width = (mastered/total*100)+"%"; bar.setNum(mastered, total);
    flipped = false;
    const itFront = dir==='it-en';
    cardWrap.innerHTML="";
    const {flip, itTxt} = flashCardEl(c, itFront);
    const reveal = $(`<button class="btn block" type="button">${ic('rotate')} Show the answer <span class="kbd-hint">space</span></button>`);
    const controls = $(`<div class="grade-row hidden">
        <button class="btn bad" type="button">${ic('x')} Again <span class="kbd-hint">1</span></button>
        <button class="btn good" type="button">${ic('check')} I knew it <span class="kbd-hint">2</span></button></div>`);
    const acts = azioniTesto(c.it, c.en, {pos:c.pos, tag:c.tag});
    acts.classList.add('hidden');
    flipFn = ()=>{
      if(flipped) return;
      flipped = true;
      flip.classList.add("flipped"); reveal.classList.add("hidden");
      controls.classList.remove("hidden"); acts.classList.remove("hidden");
      if(!itFront) setTimeout(()=>speak(itTxt), 200);
    };
    flip.onclick = flipFn; reveal.onclick = flipFn;
    gradeFn = ok=>{
      if(!flipped) return;
      flipped = false;
      haptic(ok); grade(c.id, ok);
      if(ok) mastered++; else { sbagli++; queue.push(c); }
      advance();
    };
    controls.children[0].onclick = ()=>gradeFn(false);
    controls.children[1].onclick = ()=>gradeFn(true);
    cardWrap.append(flip, reveal, controls, acts);
    if(itFront) setTimeout(()=>speak(itTxt), 150);
  }
  const onKey = e=>{
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key===' ' || e.key==='Enter'){ if(!flipped && flipFn){ e.preventDefault(); flipFn(); } return; }
    if(!flipped || !gradeFn) return;
    if(e.key==='1' || e.key==='ArrowLeft') gradeFn(false);
    else if(e.key==='2' || e.key==='ArrowRight') gradeFn(true);
  };
  document.addEventListener('keydown', onKey);
  onLeave(()=>document.removeEventListener('keydown', onKey));
  advance();
}

// ---------- MULTIPLE CHOICE ENGINE ----------
// Question: {q | qHtml, sub, correct, opts, speak?, speakAfter?, listen?, after?, id?, err?, frase?, art?}
function runMCQ(questions, title, restart, hooks){
  hooks = hooks || {};
  let i=0, correct=0;
  const stage = header(title, {narrow:true});
  if(!questions.length) return emptyDone(stage, '🤷', 'Nothing to ask', 'No questions here, for now.');
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  function show(){
    if(i>=questions.length){
      stopKeys();
      if(hooks.onEnd) hooks.onEnd(correct, questions.length);
      return finish(stage, `${correct} / ${questions.length}`, restart);
    }
    bar.style.width=(i/questions.length*100)+"%"; bar.setNum(i, questions.length);
    const Q=questions[i];
    wrap.innerHTML="";
    if(Q.kick){ const k = $(`<div class="rp-kick"><span></span></div>`); k.querySelector('span').textContent = Q.kick; wrap.appendChild(k); }
    const card = $(`<div class="qcard">${Q.art ? `<div style="width:100%;max-width:280px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2))">${Q.art}</div>` : ''}<div class="q"></div><div class="qsub"></div></div>`);
    const qEl = card.querySelector('.q');
    if(Q.qHtml){ qEl.innerHTML = Q.qHtml; qEl.style.fontSize = Math.max(19, 27 - Math.max(0, stripTags(Q.qHtml).length-20)*0.4) + 'px'; }
    else { qEl.textContent = Q.q; qEl.style.fontSize = Math.max(19, 28 - Math.max(0, String(Q.q).length-14)*0.5) + 'px'; }
    card.querySelector('.qsub').textContent = Q.sub || '';
    if(!Q.sub) card.querySelector('.qsub').remove();
    const ascolta = Q.listen || (Q.speak && !Q.speakAfter ? Q.speak : null);
    if(ascolta){ const sp=$(`<button class="btn soft sm listen-btn" type="button">${ic('vol')} Listen</button>`); sp.onclick=()=>speak(ascolta); card.appendChild(sp); }
    wrap.appendChild(card);
    const box=$(`<div class="options"></div>`);
    let answered = false;
    Q.opts.forEach((o,k)=>{
      const b=$(`<button class="opt${String(o).length>22?' long':''}" type="button"><span class="kn">${k+1}</span></button>`);
      b.dataset.v = o;
      b.appendChild(document.createTextNode(o));
      b.onclick=()=>{
        if(answered) return;
        answered = true;
        [...box.children].forEach(c=>c.disabled=true);
        const ok=o===Q.correct;
        b.classList.add(ok?"correct":"wrong");
        haptic(ok);
        if(ok) correct++;
        else [...box.children].find(c=>c.dataset.v===Q.correct).classList.add("correct");
        if(Q.id) grade(Q.id, ok);
        if(!ok && Q.err) logErrore(Q.err.it, Q.err.en, Q.err.fonte);
        if(hooks.onAnswer) hooks.onAnswer(Q, ok);
        else if(!Q.id) recordActivity(ok);
        if(Q.done) qEl.innerHTML = Q.done;
        if(Q.speak) speak(Q.speak);
        if(Q.after){ const a = $(`<div class="q-after"></div>`); a.innerHTML = Q.after; card.appendChild(a); }
        const fr = Q.frase===false ? null : (Q.frase || Q.err);
        if(fr && fr.it) card.appendChild(azioniTesto(fr.it, fr.en));
        const next=$(`<button class="btn primary block" type="button">${i+1<questions.length?"Next":"Results"} →</button>`);
        next.onclick=()=>{i++; show();}; wrap.appendChild(next);
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    stopKeys();
    onKey = e=>{
      if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if(!answered){ const k = parseInt(e.key,10); if(k>=1 && k<=Q.opts.length) box.children[k-1].click(); }
      else if(e.key==='Enter'){ const n = wrap.querySelector('.btn.primary'); if(n){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener('keydown', onKey);
  }
  onLeave(stopKeys);
  show();
}

// ---------- ACCENT KEYS (writing, conjugation, dictation) ----------
// On a phone keyboard accents need a long press: these keys insert them where the cursor is.
function makeAccentKeys(inp, locked){
  if(!settings().accenti) return null;
  const k = $(`<div class="acc-keys" role="group" aria-label="Accented letters"></div>`);
  ['à','è','é','ì','ò','ù',"'"].forEach(ch=>{
    const b = $(`<button type="button"></button>`); b.textContent = ch;
    b.onmousedown = e=>e.preventDefault();
    b.onclick = ()=>{
      if(locked && locked()) return;
      const s = inp.selectionStart ?? inp.value.length, e2 = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e2);
      try{ inp.setSelectionRange(s+1, s+1); }catch(_){}
      inp.focus({preventScroll:true});
      inp.dispatchEvent(new Event('input'));
      try{ navigator.vibrate && navigator.vibrate(4); }catch(_){}
    };
    k.appendChild(b);
  });
  return k;
}

// ---------- CONJUGATION ----------
function runConjugation(tenseFilter, verbiPool){
  const verbi = verbiPool || DB.verbi || [];
  if(!verbi.length){ const stage = header('Conjugation'); return emptyDone(stage, '📭', 'No verbs', 'There are no verbs to train.'); }
  if(tenseFilter === undefined){
    const stage = header('Conjugation');
    stage.appendChild($(`<p class="sg-intro">You see the verb, the tense and the person: write the right form. ${verbi.length} key verbs, 12 questions a round. The ones you get wrong come back sooner.</p>`));
    const list = $(`<div class="list"></div>`);
    list.appendChild(rowTile('🎲', 'Mix', 'All tenses and moods together', ()=>navigateTo(()=>runConjugation(CONJ_TENSES.map(t=>t.key), verbiPool))));
    list.appendChild(rowTile('🎯', 'The C1 essentials', 'Congiuntivo, condizionale, passato remoto', ()=>navigateTo(()=>runConjugation(['cong.pres','cong.imperf','cong.passato','cong.trap','cond.pres','cond.passato','indic.passrem'], verbiPool))));
    let modo = null;
    CONJ_TENSES.forEach(t=>{
      if(t.modo!==modo){ modo = t.modo; list.appendChild($(`<div class="sec-h">${modo}</div>`)); }
      list.appendChild(rowTile(t.comp ? '🧱' : '✏️', t.label, `${t.en}${t.comp ? ' · compound tense' : ''}`, ()=>navigateTo(()=>runConjugation([t.key], verbiPool))));
    });
    stage.appendChild(list);
    return;
  }
  const all = [];
  verbi.forEach(v=>tenseFilter.forEach(tk=>{
    for(let p=0;p<6;p++){
      const cell = conjForm(v, tk, p);
      if(!cell) continue;
      all.push({verb:v, inf:v.inf, en:v.en, tk, p, answer:cell.display, accept:cell.accept, id:`conj:${v.inf}:${tk}:${p}`});
    }
  }));
  if(!all.length){ goBack(); return; }
  const maxD = verbiPool ? 20 : 12;
  const prioritized = all.sort((a,b)=>dueScore(b.id)-dueScore(a.id)).slice(0, Math.min(maxD*2, all.length));
  const deck = shuffle(prioritized).slice(0, Math.min(maxD, prioritized.length));
  let i=0, correct=0;
  const titolo = verbiPool ? (verbi.length===1 ? `Conjugation · ${verbi[0].inf}` : 'Conjugation · my verbs') : `Conjugation · ${tenseFilter.length>1 ? 'Mix' : tenseLabel(tenseFilter[0])}`;
  const stage = header(titolo, {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  function show(){
    if(i>=deck.length) return finish(stage, `${correct} / ${deck.length}`, ()=>runConjugation(tenseFilter, verbiPool));
    bar.style.width=(i/deck.length*100)+"%"; bar.setNum(i, deck.length);
    const q = deck[i];
    wrap.innerHTML = "";
    // at B2–C1 the challenge is the form, not the meaning: the infinitive is shown
    const card = $(`<div class="qcard"><div class="kick"></div><div class="big-en" lang="it"></div><div class="qsub"></div><div class="blank"><span class="pron"></span><span class="line"></span></div></div>`);
    card.querySelector('.kick').textContent = tenseLabel(q.tk);
    card.querySelector('.big-en').textContent = q.inf;
    card.querySelector('.qsub').textContent = `${q.en} · ${tenseInfo(q.tk).en}`;
    card.querySelector('.pron').textContent = conjPronoun(q.tk, q.p);
    wrap.appendChild(card);
    const inp = $(`<input class="winput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" lang="it" placeholder="write the form…" style="margin-top:0">`);
    wrap.appendChild(inp);
    let answered = false;
    const keys = makeAccentKeys(inp, ()=>answered);
    if(keys) wrap.appendChild(keys);
    const fb = $(`<div class="fb"></div>`);
    wrap.appendChild(fb);
    const btn = $(`<button class="btn primary block" type="button">Check</button>`);
    wrap.appendChild(btn);
    function next(){ i++; show(); }
    function check(){
      const val = normConj(inp.value);
      if(!val) return;
      answered = true;
      const accepts = (q.accept||[q.answer]).map(normConj);
      const exact = accepts.includes(val);
      const loose = !exact && accepts.some(a=>stripAcc(val)===stripAcc(a));
      const ok = exact || loose;
      grade(q.id, ok); if(ok) correct++;
      haptic(ok);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'ko');
      if(keys) keys.style.display = 'none';
      if(exact){ fb.className = 'fb ok'; fb.innerHTML = `${ic('check')} Giusto!`; }
      else if(loose){ fb.className = 'fb near'; fb.innerHTML = `Almost! Mind the accent: <b>${esc(q.answer)}</b>`; }
      else { fb.className = 'fb no'; fb.innerHTML = `The right form is <b>${esc(q.answer)}</b>`; logErrore(`${conjPronoun(q.tk,q.p)} ${q.answer}`, `${q.en} — ${tenseLabel(q.tk)}`, 'Conjugation'); }
      speak(q.answer);
      const reveal = $(`<div class="reveal"><div class="reveal-head">
          <button class="speak" type="button" aria-label="Listen to the infinitive">${ic('vol')}</button>
          <div style="flex:1;min-width:0"><div class="inf"></div><div class="en"></div></div>
        </div></div>`);
      reveal.querySelector('.inf').textContent = q.inf;
      reveal.querySelector('.en').textContent = q.en || '';
      reveal.querySelector('.speak').onclick = ()=>speak(q.inf);
      reveal.appendChild(makeVerbConjBlock(q.verb, true, q.tk));
      wrap.insertBefore(reveal, btn);
      wrap.insertBefore(azioniTesto(q.answer, `${q.en} — ${conjPronoun(q.tk,q.p)}`, {verbo:q.verb}), btn);
      btn.innerHTML = `${i+1<deck.length ? 'Next' : 'Results'} →`;
      btn.onclick = next;
    }
    btn.onclick = check;
    inp.addEventListener("keydown", e=>{ if(e.key!=="Enter") return; e.preventDefault(); answered ? next() : check(); });
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  }
  show();
}

// Italian function words: never hidden, never used as distractors
const SKIP_IT = new Set(['il','lo','la','i','gli','le','un','uno','una','di','da','in','con','su','per','tra','fra','a','e','o','ma','se','che','non','è','si','ci','vi','mi','ti','ho','ha','hai','ai','al','del','della','dello','delle','dei','degli','nel','nella','nelle','nei','negli','sul','sulla','sulle','sui','sugli','dal','dalla','dalle','dai','dagli','alla','alle','agli','come','più','già','anche','molto','poi','così','però','quando','dove','cui','chi','sono','era','lui','lei','noi','voi','loro','io','tu']);
const pienaIt = w => w.length>=4 && !SKIP_IT.has(w.toLowerCase());

// ---------- Complete & listen ----------
function runPhrase(level, opts){
  const custom = opts && opts.pool && opts.pool.length ? opts.pool : null;
  const LIVELLI = [[1,'🌱','B1+','Warm-up sentences'],[2,'🌿','B2','Everyday complexity'],[3,'🌳','C1','Subjunctive, hypotheticals, formal register'],[0,'🎲','Mix','All levels, at random']];
  if(level === undefined && !custom){
    const stage = header('Complete & listen');
    stage.appendChild($(`<p class="sg-intro">Listen to the sentence and choose the missing word. The distractors are chosen to be tricky: same ending, same topic.</p>`));
    const list = $(`<div class="list"></div>`);
    LIVELLI.forEach(([lvl,ico,label,desc])=>{
      const n = lvl===0 ? (DB.frasi||[]).length : (DB.frasi||[]).filter(f=>f.difficolta===lvl).length;
      list.appendChild(rowTile(ico, label, `${desc} &middot; ${plur(n,'sentence','sentences')}`, ()=>navigateTo(()=>runPhrase(lvl))));
    });
    stage.appendChild(list);
    return;
  }
  const corpusWords = [...new Set([
    ...(DB.frasi||[]).flatMap(f=>tokenizza(f.it)),
    ...(custom||[]).flatMap(f=>tokenizza(f.it)),
  ].filter(pienaIt))];
  function pickDistractors(answer, exclude, deckWords){
    const lo = answer.toLowerCase();
    const excl = new Set([...exclude].map(w=>w.toLowerCase())); excl.add(lo);
    const ok = w => !excl.has(w.toLowerCase());
    const root = lo.slice(0, Math.min(4, lo.length - 2));
    const t1 = corpusWords.filter(w => ok(w) && w.toLowerCase().startsWith(root));
    // verbs: other forms of the same verb make the best distractors
    const verb = (indiceForme().get(lo)||[]).find(a=>a.cat==='verbo');
    const tv = verb ? Object.values(verb.verbo.coniugazioni||{}).flat().filter(f=>f && ok(f) && !/\s/.test(f)) : [];
    const t2 = (deckWords||[]).filter(ok);
    const t3 = corpusWords.filter(w => ok(w) && w.toLowerCase().slice(-3)===lo.slice(-3));
    const t4 = corpusWords.filter(w => ok(w) && w.toLowerCase().slice(-2)===lo.slice(-2));
    const t5 = corpusWords.filter(w => ok(w) && Math.abs(w.length-answer.length)<=1);
    const result = [], picked = new Set();
    for(const tier of [shuffle([...new Set(tv)]).slice(0,2), t1, t3, t2, t4, t5, corpusWords]){
      for(const w of shuffle([...new Set(tier)])){
        if(result.length>=3) break;
        if(!picked.has(w.toLowerCase()) && ok(w)){ result.push(w); picked.add(w.toLowerCase()); }
      }
      if(result.length>=3) break;
    }
    return result;
  }
  const allFrasi = custom || DB.frasi || [];
  const filtered = custom || (level===0 ? allFrasi : allFrasi.filter(f=>f.difficolta===level));
  const pool = filtered.length ? filtered : allFrasi;
  const deck = custom ? shuffle([...pool]) : sample(pool, Math.min(8, pool.length));
  if(!deck.length) return;
  let i=0, correct=0;
  const livello = (LIVELLI.find(l=>l[0]===level)||[])[2];
  const stage = header((opts && opts.titolo) || (livello ? `Complete · ${livello}` : 'Complete & listen'), {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, ()=>runPhrase(level, opts)); }
    bar.style.width=(i/deck.length*100)+"%"; bar.setNum(i, deck.length);
    const f = deck[i], sentence = f.it || '';
    const raw = sentence.split(' ');
    const clean = raw.map(w=>w.replace(/^[«"“(]+|[.,!?;:»”")…]+$/g,'').replace(/^[a-zà-ÿ]+'/i,''));
    let cand = clean.map((w,idx)=>({w,idx})).filter(({w})=>pienaIt(w));
    if(!cand.length) cand = clean.map((w,idx)=>({w,idx})).sort((a,b)=>b.w.length-a.w.length).slice(0,1);
    const {w: answer, idx: hideIdx} = cand[Math.floor(Math.random()*cand.length)];
    const masked = raw.map((w,idx)=>idx===hideIdx ? esc(w.replace(answer, '§')).replace('§','<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>') : esc(w)).join(' ');
    const deckWords = deck.filter(d=>d!==f).flatMap(d=>tokenizza(d.it)).filter(pienaIt);
    const choices = shuffle([answer, ...pickDistractors(answer, new Set(clean), deckWords)]);
    wrap.innerHTML="";
    const card = $(`<div class="qcard"><div class="q">${masked}</div><div class="qsub"></div>
        <button class="btn soft sm listen-btn" type="button" style="margin-top:6px">${ic('vol')} Listen</button></div>`);
    card.querySelector('.qsub').textContent = f.en || '';
    card.querySelector('.q').style.fontSize = Math.max(19, 27 - Math.max(0, sentence.length-20)*0.33) + 'px';
    card.querySelector('.listen-btn').onclick = ()=>speak(sentence);
    wrap.appendChild(card);
    const optBox=$(`<div class="options"></div>`);
    let answered = false;
    choices.forEach((o,k)=>{
      const b=$(`<button class="opt" type="button"><span class="kn">${k+1}</span></button>`);
      b.dataset.v = o; b.appendChild(document.createTextNode(o));
      b.onclick=()=>{
        if(answered) return;
        answered = true;
        [...optBox.children].forEach(c=>c.disabled=true);
        const ok = o===answer;
        b.classList.add(ok?"correct":"wrong");
        if(!ok) [...optBox.children].find(c=>c.dataset.v===answer).classList.add("correct");
        if(ok) correct++;
        haptic(ok);
        if(f.id && !String(f.id).startsWith('x') && (DB.frasi||[]).some(x=>x.id===f.id)) grade(f.id, ok); else { recordActivity(ok); if(!ok) logErrore(f.it, f.en, 'Sentences'); }
        speak(sentence);
        card.querySelector('.q').innerHTML = raw.map((w,idx)=>idx===hideIdx?`<span style="color:var(--good)">${esc(w)}</span>`:esc(w)).join(" ");
        card.appendChild(azioniTesto(sentence, f.en));
        const next=$(`<button class="btn primary block" type="button">${i+1<deck.length?'Continue':'Results'} →</button>`);
        next.onclick=()=>{i++; show();}; wrap.appendChild(next);
      };
      optBox.appendChild(b);
    });
    wrap.appendChild(optBox);
    stopKeys();
    onKey = e=>{
      if(!answered){ const k = parseInt(e.key,10); if(k>=1 && k<=choices.length) optBox.children[k-1].click(); }
      else if(e.key==='Enter'){ const n = wrap.querySelector('.btn.primary'); if(n){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener('keydown', onKey);
  }
  onLeave(stopKeys);
  show();
}

// ---------- Compose the sentence ----------
function paroleComponi(it){ return String(it||'').split(/\s+/).map(w=>w.replace(/^[«"“(]+|[.,!?;:»”")…]+$/g,'')).filter(w=>/[a-zà-ÿ0-9]/i.test(w)); }
function runComponi(level, opts){
  opts = opts || {};
  const custom = opts.pool && opts.pool.length ? opts.pool : null;
  const frasi = (DB.frasi||[]).map(f=>({id:f.id, it:f.it, en:f.en}));
  const dlg = (DB.dialoghi||[]).flatMap(d=>d.battute.map((b,k)=>({id:`d-${d.id}-${k}`, it:b.it, en:b.en, dlg:true})));
  const nW = f => paroleComponi(f.it).length;
  const LIV = [
    ['brevi','🌱','Short','4–6 words', frasi.filter(f=>nW(f)>=4 && nW(f)<=6)],
    ['medie','🌿','Medium','7–9 words', frasi.filter(f=>nW(f)>=7 && nW(f)<=9)],
    ['lunghe','🌳','Long','10 words or more', frasi.filter(f=>nW(f)>=10 && nW(f)<=15)],
    ['dialoghi','🎭','From the dialogues','Lines from real-life scenes', dlg.filter(f=>nW(f)>=4 && nW(f)<=11)],
  ];
  if(!custom && !level){
    const stage = header('Compose the sentence');
    stage.appendChild($(`<p class="sg-intro">Read the English and tap the Italian words <b>in the right order</b>. The best way to feel where pronouns, adverbs and «non» go.</p>`));
    const list = $(`<div class="list"></div>`);
    LIV.forEach(([k,e,t,dd,p])=>list.appendChild(rowTile(e, t, `${dd} &middot; ${plur(p.length,'sentence','sentences')}`, ()=>navigateTo(()=>runComponi(k)))));
    stage.appendChild(list);
    const tot = extraStore().cmp || 0;
    if(tot) stage.appendChild($(`<p class="muted" style="margin:4px 0 0">So far you have composed ${plur(tot,'sentence','sentences')} correctly.</p>`));
    return;
  }
  const liv = LIV.find(l=>l[0]===level);
  const base = (custom || (liv ? liv[4] : [])).filter(f=>nW(f)>=2 && nW(f)<=16);
  if(!base.length){ const st = header('Compose the sentence'); return emptyDone(st, '🧩', 'No suitable sentences', 'Sentences of at least two words are needed here.'); }
  const deck = shuffle(shuffle(base).sort((a,b)=>(isDue(b.id)?1:0)-(isDue(a.id)?1:0)).slice(0, 8));
  const titolo = opts.titolo ? `Compose · ${opts.titolo}` : liv ? `Compose · ${liv[2]}` : 'Compose the sentence';
  const stage = header(titolo, {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:14px"></div>`); stage.appendChild(wrap);
  let i = 0, correct = 0, onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  onLeave(stopKeys);
  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, ()=>runComponi(level, opts)); }
    bar.style.width = (i/deck.length*100)+'%'; bar.setNum(i, deck.length);
    const f = deck[i];
    const giuste = paroleComponi(f.it);
    let chips = giuste.map((w,k)=>({w: k===0 ? w : w, k}));
    for(let g=0; g<8; g++){ chips = shuffle(chips); if(chips.some((c,j)=>c.w!==giuste[j])) break; }
    const scelte = [];
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick">Translate into Italian</div><div class="big-en"></div>
      <button class="btn soft sm listen-btn" type="button">${ic('vol')} Hint: listen</button></div>`);
    card.querySelector('.big-en').textContent = f.en;
    card.querySelector('.big-en').style.fontSize = Math.max(18, 25 - Math.max(0, f.en.length-28)*0.25) + 'px';
    card.querySelector('.listen-btn').onclick = ()=>speak(f.it);
    const line = $(`<div class="cmp-line"><span class="ph">Tap the words below</span></div>`);
    const bank = $(`<div class="cmp-bank"></div>`);
    const chk = $(`<button class="btn primary block" type="button" disabled>${ic('check')} Check</button>`);
    wrap.append(card, line, bank, chk);
    let answered = false;
    const bankBtns = chips.map((c, j)=>{
      const b = $(`<button class="chipw" type="button"></button>`);
      b.textContent = c.w;
      b.onclick = ()=>{ if(answered || b.classList.contains('used')) return; b.classList.add('used'); scelte.push(j); paint(); };
      bank.appendChild(b);
      return b;
    });
    function paint(){
      line.innerHTML = '';
      if(!scelte.length) line.appendChild($(`<span class="ph">Tap the words below</span>`));
      scelte.forEach((j, pos)=>{
        const b = $(`<button class="chipw" type="button"></button>`);
        b.textContent = chips[j].w;
        b.onclick = ()=>{ if(answered) return; scelte.splice(pos, 1); bankBtns[j].classList.remove('used'); paint(); };
        line.appendChild(b);
      });
      chk.disabled = scelte.length !== chips.length;
    }
    chk.onclick = ()=>{
      if(answered){ i++; return show(); }
      if(scelte.length !== chips.length) return;
      answered = true;
      const ok = scelte.every((j, pos)=>chips[j].w.toLowerCase() === giuste[pos].toLowerCase());
      if(ok) correct++;
      haptic(ok); contaExtra('cmp', ok);
      if(!ok) logErrore(f.it, f.en, 'Compose');
      if(!f.dlg && (DB.frasi||[]).some(x=>x.id===f.id)) grade(f.id, ok); else recordActivity(ok);
      line.classList.add(ok ? 'ok' : 'ko');
      bank.style.display = 'none';
      const sol = $(`<div class="cmp-sol"><div class="lab"></div><div class="it"></div></div>`);
      sol.querySelector('.lab').textContent = ok ? '✓ Perfetto!' : 'The right sentence:';
      sol.querySelector('.lab').style.color = ok ? 'var(--good)' : 'var(--bad)';
      sol.querySelector('.it').textContent = f.it;
      sol.onclick = ()=>speak(f.it);
      wrap.insertBefore(sol, chk);
      wrap.insertBefore(azioniTesto(f.it, f.en), chk);
      speak(f.it);
      chk.innerHTML = `${i+1<deck.length ? 'Continue' : 'Results'} →`;
      chk.disabled = false;
    };
    stopKeys();
    onKey = e=>{
      if(e.key==='Enter'){ if(!chk.disabled){ e.preventDefault(); chk.click(); } return; }
      if(answered) return;
      if(e.key==='Backspace' && scelte.length){ e.preventDefault(); const j = scelte.pop(); bankBtns[j].classList.remove('used'); paint(); return; }
      const k = parseInt(e.key, 10);
      if(k>=1 && k<=9){ const free = bankBtns.filter(b=>!b.classList.contains('used')); if(free[k-1]) free[k-1].click(); }
    };
    document.addEventListener('keydown', onKey);
  }
  show();
}

// ---------- Sentence dictation ----------
function normWrite(s){
  return normApo(s||"").toLowerCase().replace(/[.,!?;:«»"“”()…—–-]/g," ").replace(/\s+/g," ").trim();
}
function runDettatoFrasi(){
  const pool = (DB.frasi||[]).filter(f=>{ const n = paroleComponi(f.it).length; return n>=4 && n<=11; });
  const deck = shuffle(pool.slice()).sort((a,b)=>(isDue(b.id)?1:0)-(isDue(a.id)?1:0)).slice(0, 8);

  const bar = progressBar(stage);

  onLeave(()=>{ stopKeys(); stopSpeech(); });
  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, runDettatoFrasi); }
    bar.style.width = (i/deck.length*100)+'%'; bar.setNum(i, deck.length);
    const f = deck[i], solW = paroleComponi(f.it);
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick">Write what you hear</div>
      <div class="row" style="justify-content:center;gap:10px"><button class="big-play" type="button" aria-label="Listen">${ic('vol')}</button>
      <button class="slow-play" type="button" aria-label="Listen slowly">🐢</button></div>

    card.querySelector('.big-play').onclick = ()=>speak(f.it);
    card.querySelector('.slow-play').onclick = ()=>speak(f.it, 0.6);
    wrap.appendChild(card);
    const inp = $(`<input class="vocab-input plain dt-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" lang="it" placeholder="Write in Italian…">`);
    let answered = false;
    const keys = makeAccentKeys(inp, ()=>answered);
    const chk = $(`<button class="btn primary block" type="button">${ic('check')} Check</button>`);
    const res = $(`<div class="dt-res" style="display:none"></div>`);
    wrap.append(inp);
    if(keys) wrap.appendChild(keys);
    wrap.append(res, chk);
    chk.onclick = ()=>{
      if(answered){ i++; return show(); }
      if(!inp.value.trim()){ inp.focus(); return; }
      answered = true;
      const scritte = normWrite(inp.value).split(' ').filter(Boolean);
      const giuste = solW.map(w=>normWrite(w)).join(' ').split(' ').filter(Boolean);
      const ok = scritte.join(' ') === giuste.join(' ');
      const quasi = !ok && stripAcc(scritte.join(' ')) === stripAcc(giuste.join(' '));
      if(ok) correct++;
      haptic(ok); grade(f.id, ok);
      if(!ok) logErrore(f.it, f.en, 'Dictation');
      const parole = f.it.split(/\s+/);
      let k = 0;
      res.innerHTML = `<div class="dt-cmp">${parole.map(w=>{ const n = normWrite(w).split(' ').filter(Boolean); const hit = n.every(x=>scritte[k++]===x); return `<span class="${hit?'ok':'no'}">${esc(w)}</span>`; }).join(' ')}</div><div class="dt-en"></div>${quasi ? '<div class="fb near" style="text-align:left;margin-top:6px">Almost: only the accents are wrong.</div>' : ''}`;
      res.querySelector('.dt-en').textContent = f.en;
      res.style.display = '';
      res.appendChild(azioniTesto(f.it, f.en));
      inp.classList.add(ok ? 'ok' : 'ko'); inp.readOnly = true;
      if(keys) keys.style.display = 'none';
      chk.innerHTML = `${ok ? '✓ Giusto! ' : ''}${i+1<deck.length ? 'Continue' : 'Results'} →`;
      speak(f.it);
    };
    stopKeys();
    onKey = e=>{ if(e.key==='Enter'){ e.preventDefault(); chk.click(); } };
    document.addEventListener('keydown', onKey);
    setTimeout(()=>speak(f.it), 300);
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 80);
  }
  show();
}

// ---------- WRITING (active production) ----------
function diffHtml(typed, sol){
  const a = normWrite(typed), b = normWrite(sol);
  let out = "";
  for(let i=0; i<a.length; i++){ const ok = a[i] === b[i]; out += `<span class="ch ${ok?"good":"bad"}">${a[i]===" "?"&nbsp;":esc(a[i])}</span>`; }
  return out || "&mdash;";
}
function pickScritturaTopic(){

  });

function runScrittura(pool, label, opts){
  opts = opts || {};
  let deck = (pool||[]).filter(c=>c.it && c.en);
  if(!opts.ignoreDue) deck = deck.filter(c=>isDue(c.id));
  deck = deck.sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  if(opts.ignoreDue) deck = shuffle(deck);
  if(opts.limit) deck = deck.slice(0, opts.limit);
  const stage = header(label ? `Writing · ${label}` : 'Writing', {narrow:true});
  if(!deck.length) return emptyDone(stage, '✅', 'All reviewed!', "No words due here. Come back later, or pick a topic.");
  const total = deck.length;
  let queue = deck.slice(), mastered = 0, errori = 0, c = null, answered = false, usedHint = false, cardSeq = 0;
  let modo = localStorage.getItem("scritturaModo") === "audio" ? "audio" : "en";
  const top = $(`<div class="ex-top"></div>`);
  const seg = $(`<div class="seg sm center"><button type="button" data-m="en">🇬🇧 From English</button><button type="button" data-m="audio">🔊 Dictation</button></div>`);
  const paintSeg = ()=>seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.m===modo));
  seg.querySelectorAll("button").forEach(b=>{ b.onclick = ()=>{ if(modo===b.dataset.m) return; modo=b.dataset.m; localStorage.setItem("scritturaModo",modo); paintSeg(); show(); }; });
  paintSeg();
  top.appendChild(seg);
  stage.appendChild(top);
  const bar = progressBar(top);
  const wrap = $(`<div class="list" style="gap:12px"></div>`);
  stage.appendChild(wrap);
  // the expected answer: nouns with their article («la chiave»); the bare noun is accepted too
  const attesa = v => parolaConArticolo(v);
  function advance(){
    if(!queue.length) return finish(stage, `${total} / ${total + errori}`, opts.restart || (()=>runScrittura(pool, label, opts)), {
      titolo: errori ? 'Writing done!' : 'Perfetto, all right!',
      testo: errori ? `${plur(total,'word written','words written')}, ${errori===1?'one mistake':errori+' mistakes'} along the way.` : `${plur(total,'word written','words written')} without mistakes.`
    });
    c = queue.shift(); answered = false; usedHint = false; cardSeq++; show();
  }
  function show(){
    bar.style.width = (mastered/total*100)+"%"; bar.setNum(mastered, total);
    wrap.innerHTML = "";
    const mySeq = cardSeq;
    const g = genereDi(c);
    const wbox = $(`<div class="wbox">${modo==="audio"
        ? `<button class="speak" type="button" aria-label="Listen again">${ic('vol')}</button><div class="sub">Listen and write what you hear</div>`
        : `<div class="prompt"></div><div class="sub"></div>`}</div>`);
    if(modo!=="audio"){
      wbox.querySelector('.prompt').textContent = c.en;
      wbox.querySelector('.sub').textContent = c.pos==='noun' && g && g!=='mf' ? 'Write it in Italian, with the article' : 'Write it in Italian';
    }
    const inp = $(`<input class="winput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" lang="it" placeholder="type in Italian…">`);
    wbox.appendChild(inp);
    const sol = $(`<div class="wsol" style="display:none"></div>`);
    wbox.appendChild(sol);
    wrap.appendChild(wbox);
    if(modo==="audio"){ wbox.querySelector(".speak").onclick = ()=>speak(attesa(c)); setTimeout(()=>{ if(mySeq===cardSeq) speak(attesa(c)); }, 250); }
    const keys = makeAccentKeys(inp, ()=>answered);
    if(keys) wrap.appendChild(keys);
    const row = $(`<div class="row"></div>`);
    const hint = $(`<button class="btn" type="button" style="flex:0 0 auto;padding:0 16px" title="Reveals the next letter: the card counts as wrong" aria-label="Hint">${ic('bulb')}</button>`);
    const check = $(`<button class="btn primary" type="button" style="flex:1">Check</button>`);
    row.append(hint, check);
    wrap.appendChild(row);
    hint.onclick = ()=>{
      if(answered) return;
      usedHint = true;
      const target = attesa(c);
      let keep = 0;
      while(keep < inp.value.length && keep < target.length && normWrite(inp.value[keep]) === normWrite(target[keep])) keep++;
      inp.value = target.slice(0, keep+1);
      inp.focus();
    };
    const avanti = ()=>{ if(mySeq===cardSeq) advance(); };
    check.onclick = ()=>{
      if(answered){ avanti(); return; }
      if(!inp.value.trim()) return;
      const t = normWrite(inp.value), full = normWrite(attesa(c)), bare = normWrite(c.it);
      const esatto = t===full || t===bare;
      const soloAccenti = !esatto && (stripAcc(t)===stripAcc(full) || stripAcc(t)===stripAcc(bare));
      const ok = esatto && !usedHint;
      answered = true;
      inp.readOnly = true;
      hint.style.display = "none";
      inp.classList.add(ok ? "ok" : "ko");
      grade(c.id, ok);
      haptic(ok);
      if(keys) keys.style.display = "none";
      sol.style.display = "";
      speak(attesa(c));
      const acts = azioniTesto(c.it, c.en, {pos:c.pos, tag:c.tag});
      wrap.insertBefore(acts, row);
      if(ok){
        mastered++;
        const senzaArt = t===bare && full!==bare;
        sol.innerHTML = `<span style="color:var(--good);font-weight:800">✓ Giusto!</span>${senzaArt ? ` &middot; with the article: <b>${esc(attesa(c))}</b>` : ''}${modo==="audio"?` &middot; ${esc(c.en)}`:""}`;
        check.textContent = "Next →";
        const auto = setTimeout(()=>{ if(answered) avanti(); }, senzaArt ? 2600 : 1600);
        acts.addEventListener('pointerdown', ()=>clearTimeout(auto), true);
      } else {
        errori++;
        queue.push(c);
        sol.innerHTML = `${esatto ? "Right, but with the hint — it will come back:" : soloAccenti ? "Almost — check the accents:" : "You wrote"} <span class="typed">${diffHtml(inp.value, attesa(c))}</span>
          <span class="sol">${esc(attesa(c))}</span><span style="font-size:13px">${esc(c.en)}</span>`;
        check.textContent = "Next →";
      }
    };
    inp.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); check.onclick(); } };
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  }
  advance();
}

function runErrori(){
  let deck = shuffle(erroriStore().slice());
  const tot = deck.length;
  const stage = header('Review my mistakes', {narrow:true});
  if(!tot) return emptyDone(stage, '🎯', 'No mistakes to review', 'When you get an answer wrong, you will find it here.');
  const bar = progressBar(stage);

  let fatti = 0, sbagli = 0, onKey = null;

  onLeave(stopKeys);
  function show(){
    if(!deck.length){ stopKeys(); return finish(stage, `${fatti} / ${fatti+sbagli}`, runErrori, {titolo:'Mistakes reviewed!', testo:`${plur(fatti,'mistake fixed','mistakes fixed')}.`}); }
    bar.style.width = (fatti/tot*100)+'%'; bar.setNum(fatti, tot);
    const e = deck[0];
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick"></div><div class="big-en"></div><div class="er-it" style="display:none"></div></div>`);
    card.querySelector('.kick').textContent = e.fonte || 'Mistake';
    card.querySelector('.big-en').textContent = e.en || '—';
    card.querySelector('.big-en').style.fontSize = Math.max(18, 25 - Math.max(0, (e.en||'').length-26)*0.3) + 'px';
    card.querySelector('.er-it').textContent = e.it;
    const rev = $(`<button class="btn block" type="button">${ic('eye')} Show the Italian</button>`);

    const acts = azioniTesto(e.it, e.en);
    acts.classList.add('hidden');
    wrap.append(card, rev, g2, acts);
    let aperta = false;
    const apri = ()=>{ if(aperta) return; aperta = true; card.querySelector('.er-it').style.display = ''; rev.classList.add('hidden'); g2.classList.remove('hidden'); acts.classList.remove('hidden'); speak(e.it); };
    const vota = ok=>{
      if(!aperta) return;
      aperta = false;
      haptic(ok); recordActivity(ok);
      deck.shift();
      if(ok){ fatti++; togliErrore(e.it); } else { sbagli++; deck.push(e); }
      show();
    };
    rev.onclick = apri; card.onclick = apri;
    g2.children[0].onclick = ()=>vota(false);
    g2.children[1].onclick = ()=>vota(true);
    stopKeys();
    onKey = ev=>{ if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); apri(); } else if(ev.key==='1') vota(false); else if(ev.key==='2') vota(true); };
    document.addEventListener('keydown', onKey);
  }
  show();
}

// =====================================================================
// DAILY REVIEW: mixed activities. Not only flashcards: every day a deck of
// activities from the whole app — words (flip or choose), a verb of the day
// to study in one tense, sentences to compose or complete, grammar-gym
// questions, articles, dialogue lines, proverbs, idioms, false friends and
// the Italy atlas. The deck stays the same all day (italiano_daily_v1.items)
// and resumes where you left off (pos); it renews at midnight or once done.
// =====================================================================
const DAILY_KEY = "italiano_daily_v1";
function dailySize(){ const n = settings().dailySize; return [10,15,20].includes(n) ? n : 10; }
function dailyState(){ try{ return JSON.parse(localStorage.getItem(DAILY_KEY)||"{}") || {}; }catch(e){ return {}; } }
function updDaily(fn){ const s = dailyState(); fn(s); try{ localStorage.setItem(DAILY_KEY, JSON.stringify(s)); }catch(e){} return s; }
function dailyStreak(){
  const s=dailyState();
  if(!s.last) return 0;
  return (s.last===todayStr()||s.last===yesterdayStr()) ? (s.streak||0) : 0;
}
function recordDailyDone(){
  const t = todayStr();
  let primaOggi = false;
  updDaily(s=>{
    s.streak = (s.last===yesterdayStr()) ? (s.streak||0)+1 : (s.last===t ? (s.streak||1) : 1);
    primaOggi = s.last !== t;
    s.last=t; s.completed=true;
  });
  if(primaOggi) addXP(50);
}
const RIPASSO_TIPI = {
  parola:    ['🃏', 'Word',                  'parola'],

  componi:   ['🧩', 'Compose the sentence',  'frase'],
  completa:  ['🎧', 'Complete the sentence', 'frase'],
  gym:       ['🏋️', 'Grammar gym',           'gram'],
  articolo:  ['📰', 'Articles',              'gram'],
  dialogo:   ['🎭', 'What do you answer?',   'varie'],

  falsoamico:['🪤', 'False friend',          'varie'],

};
const VERBO_TEMPI = ['indic.pres','cong.pres','indic.passrem','cond.pres','indic.futuro','cong.imperf','indic.imperf'];
function getDailyItems(){
  if(!DB) return [];
  const s = dailyState(), t = todayStr();
  if(s.date===t && !s.completed && Array.isArray(s.items) && s.items.length) return s.items;
  const items = componiRipasso(dailySize());
  updDaily(x=>{ x.date=t; x.items=items; x.pos=0; x.ok=0; x.tot=0; x.completed=false; delete x.cards; });

function battuteRisposta(d){
  const mio = dlgMio(d);
  return d.battute.map((b,k)=>k).filter(k=>k>0 && d.battute[k].s===mio && d.battute[k-1].s!==mio);

function componiRipasso(n){
  const nVerbi = Math.max(1, Math.round(n/10));
  const nFrasi = Math.max(1, Math.round(n*0.2));
  const nGram  = Math.max(1, Math.round(n*0.2));
  const nVarie = Math.max(1, Math.round(n/10));
  const out = [];
  const giorno = giornoN();
  const ruota = a => a.map((x,k)=>a[(k+giorno)%a.length]);
  // verb: the tense of the day, and the verbs with most forms still to learn in it
  const tk = VERBO_TEMPI[giorno % VERBO_TEMPI.length];
  const verbi = shuffle((DB.verbi||[]).filter(v=>(v.coniugazioni[tk]||[]).filter(Boolean).length>=5));
  const daRip = v => [0,1,2,3,4,5].filter(p=>isDue(`conj:${v.inf}:${tk}:${p}`)).length;
  verbi.sort((a,b)=>daRip(b)-daRip(a)).slice(0, nVerbi).forEach(v=>out.push({t:'verbo', inf:v.inf, tk}));
  // sentences: the ones due first, alternately to compose and to complete
  const nW = f => paroleComponi(f.it).length;
  const frasi = shuffle((DB.frasi||[]).filter(f=>f.it && f.en && nW(f)>=4 && nW(f)<=11))
    .sort((a,b)=>(isDue(b.id)?1:0)-(isDue(a.id)?1:0)).slice(0, nFrasi);
  const primo = giorno % 2;
  frasi.forEach((f,k)=>out.push({t:(k+primo)%2 ? 'completa' : 'componi', id:f.id}));
  // grammar and miscellany: one type after the other, never the same item twice
  const usati = new Set();
  const pesca = tipo=>{
    for(let tent=0; tent<14; tent++){
      let it = null;
      if(tipo==='gym'){
        const P = (DB.palestra||[]).filter(p=>(p.domande||[]).length);
        if(P.length){ const p = P[(giorno + tent) % P.length]; it = {t:'gym', g:p.id, k:rnd(0, p.domande.length-1)}; }
      }
      else if(tipo==='articolo'){ it = {t:'articolo', k:rnd(0, ARTICOLI_NOMI.length-1), pl:Math.random()<.35}; }
      else if(tipo==='dialogo'){
        const d = (DB.dialoghi||[]).filter(x=>battuteRisposta(x).length);
        if(d.length){ const x = d[rnd(0, d.length-1)], ks = battuteRisposta(x); it = {t:'dialogo', d:x.id, k:ks[rnd(0, ks.length-1)]}; }
      }
      else if(tipo==='proverbio'){ const p = DB.proverbi||[]; if(p.length >= 4) it = {t:'proverbio', k:rnd(0, p.length-1)}; }
      else if(tipo==='idioma'){ const e = (DB.modididire||[]).flatMap(c=>c.espressioni||[]); if(e.length >= 4) it = {t:'idioma', k:rnd(0, e.length-1)}; }
      else if(tipo==='falsoamico'){ const f = DB.falsiAmici||[]; if(f.length >= 4) it = {t:'falsoamico', k:rnd(0, f.length-1)}; }
      else if(tipo==='luogo'){ const l = DB.luoghi||[]; if(l.length >= 4) it = {t:'luogo', id:l[rnd(0, l.length-1)].id}; }
      if(!it) return null;
      const key = JSON.stringify(it);
      if(!usati.has(key)){ usati.add(key); return it; }
    }
    return null;
  };
  const riempi = (tipi, quanti)=>{
    let messi = 0;
    for(let k=0; messi<quanti && k<quanti*3; k++){ const it = pesca(tipi[k % tipi.length]); if(it){ out.push(it); messi++; } }
  };
  riempi(ruota(['gym','gym','articolo']), nGram);
  riempi(ruota(['dialogo','proverbio','idioma','falsoamico','luogo']), nVarie);
  // words: all the rest, the most urgent first; alternately flip and choose
  const voci = (DB.voci||[]).filter(v=>v.it && v.en && v.en.length<=40);
  const due = voci.filter(v=>isDue(v.id) && srs[v.id]).sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  const mai = shuffle(voci.filter(v=>!srs[v.id]));
  // new words: C1 and topic words mixed with the basics
  const notDue = shuffle(voci.filter(v=>!isDue(v.id)));
  [...due, ...mai, ...notDue].slice(0, Math.max(0, n - out.length))
    .forEach((v,k)=>out.push({t:'parola', id:v.id, m:k%2 ? 'scelta' : 'carta'}));
  return mescolaRipasso(out);
}
// start with a word to warm up, then never two activities of the same kind in a row
function mescolaRipasso(items){
  const gruppi = {};
  items.forEach(x=>{ const g = (RIPASSO_TIPI[x.t]||[])[2] || x.t; (gruppi[g] = gruppi[g] || []).push(x); });
  const out = []; let prev = null;
  while(out.length < items.length){
    let keys = Object.keys(gruppi).filter(g=>gruppi[g].length);
    if(!out.length && keys.includes('parola')) keys = ['parola'];
    const altri = keys.filter(g=>g!==prev);
    const scelta = altri.length ? altri : keys;
    const peso = g => gruppi[g].length * gruppi[g].length;
    let r = Math.random() * scelta.reduce((a,g)=>a+peso(g), 0), g = scelta[0];
    for(const k of scelta){ r -= peso(k); if(r < 0){ g = k; break; } }
    out.push(gruppi[g].shift()); prev = g;
  }
  return out;
}
function riassuntoRipasso(items){
  const nomi = {parola:null, verbo:'a verb', componi:'sentences', completa:'sentences', gym:'grammar', articolo:'articles',
                dialogo:'a dialogue', proverbio:'a proverb', idioma:'an idiom', falsoamico:'a false friend', luogo:'the atlas'};
  const np = items.filter(x=>x.t==='parola').length;
  const parti = np ? [plur(np, 'word', 'words')] : [];
  Object.keys(nomi).forEach(t=>{ const s = nomi[t]; if(s && items.some(x=>x.t===t) && !parti.includes(s)) parti.push(s); });
  return parti.length > 1 ? parti.slice(0,-1).join(', ') + ' and ' + parti[parti.length-1] : (parti[0] || '');
}

function runDaily(){
  const items = getDailyItems();
  const stage = header('Daily review', {narrow:true});
  if(!items.length) return emptyDone(stage, '📭', 'Nothing to review', 'I can\'t find content for today\'s review.');
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let onKey = null;
  const keyh = e=>{ if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return; if(onKey) onKey(e); };
  document.addEventListener('keydown', keyh);
  onLeave(()=>{ document.removeEventListener('keydown', keyh); stopSpeech(); });
  function show(){
    const s = dailyState(), pos = s.pos || 0;
    onKey = null;
    if(pos >= items.length){
      document.removeEventListener('keydown', keyh);
      const ok = s.ok || 0, tot = s.tot || 0;
      recordDailyDone();
      return finish(stage, `${ok} / ${tot}`, runDaily, {
        titolo: 'Review complete!',
        testo: `${plur(items.length, 'activity', 'activities')}: ${riassuntoRipasso(items)}. ${ok} right answers out of ${tot}.`
      });
    }
    bar.style.width = (pos/items.length*100)+'%'; bar.setNum(pos, items.length);
    wrap.innerHTML = '';
    const it = items[pos], tipo = RIPASSO_TIPI[it.t] || ['•', ''];
    const kick = $(`<div class="rp-kick"><span></span></div>`);
    kick.querySelector('span').textContent = `${tipo[0]} ${tipo[1]}`;
    wrap.appendChild(kick);
    let chiuso = false;
    const ctx = {
      wrap, kick,
      keys(fn){ onKey = fn; },
      fatto(giuste, totali, auto){
        if(chiuso) return; chiuso = true;
        updDaily(x=>{ x.pos = pos+1; x.ok = (x.ok||0) + giuste; x.tot = (x.tot||0) + totali; });
        if(auto) return show();
        const next = $(`<button class="btn primary block" type="button">${pos+1<items.length ? 'Next' : 'Results'} →</button>`);
        next.onclick = show;
        wrap.appendChild(next);
        onKey = e=>{ if(e.key==='Enter'){ e.preventDefault(); show(); } };
      }
    };
    const fn = RIPASSO_RENDER[it.t];
    let ok = false;
    try{ ok = fn ? fn(it, ctx) !== false : false; }catch(e){ console.error(e); ok = false; }
    if(!ok){ updDaily(x=>{ x.pos = pos+1; }); show(); }
  }
  show();
}
function rpOpzioni(ctx, opts, giusta, dopo){
  const box = $(`<div class="options"></div>`);
  let answered = false;
  opts.forEach((o,k)=>{
    const b = $(`<button class="opt${String(o).length>22?' long':''}" type="button"><span class="kn">${k+1}</span></button>`);
    b.dataset.v = o;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>{
      if(answered) return;
      answered = true;
      [...box.children].forEach(c=>c.disabled=true);
      const ok = o===giusta;
      b.classList.add(ok ? 'correct' : 'wrong');
      if(!ok){ const g = [...box.children].find(c=>c.dataset.v===giusta); if(g) g.classList.add('correct'); }
      haptic(ok);
      dopo(ok);
    };
    box.appendChild(b);
  });
  ctx.wrap.appendChild(box);
  ctx.keys(e=>{ const k = parseInt(e.key,10); if(!answered && k>=1 && k<=opts.length) box.children[k-1].click(); });
  return box;
}
function rpCard(ctx, q, sub, ascolta, html){
  const card = $(`<div class="qcard"><div class="q"></div><div class="qsub"></div></div>`);
  const qEl = card.querySelector('.q');
  if(html) qEl.innerHTML = html; else qEl.textContent = q;
  qEl.style.fontSize = Math.max(19, 28 - Math.max(0, stripTags(html||q).length-14)*0.5) + 'px';
  card.querySelector('.qsub').textContent = sub || '';
  if(!sub) card.querySelector('.qsub').remove();
  if(ascolta){ const sp = $(`<button class="btn soft sm listen-btn" type="button">${ic('vol')} Listen</button>`); sp.onclick = ()=>speak(ascolta); card.appendChild(sp); }
  ctx.wrap.appendChild(card);
  return card;
}
const rpNota = (card, html)=>{ if(!html) return; const a = $(`<div class="q-after"></div>`); a.innerHTML = html; card.appendChild(a); };
const rpDistr = (giusta, altre, n) => sample([...new Set(altre.filter(x=>x && x!==giusta))], n || 3);

const RIPASSO_RENDER = {
  parola(it, ctx){
    const v = voceById(it.id);
    if(!v) return false;
    if(it.m==='scelta'){
      const altre = (DB.voci||[]).filter(x=>x.en && x.en.length<=34 && x.en!==v.en && (x.pos===v.pos || Math.random()<.3)).map(x=>x.en);
      const opts = shuffle([v.en, ...rpDistr(v.en, sample(altre, 40))]);
      ctx.kick.querySelector('span').textContent = '🃏 Word · what does it mean?';
      const card = rpCard(ctx, parolaConArticolo(v), v.livello==='C1' ? 'C1 word' : '', parolaConArticolo(v));
      card.querySelector('.q').setAttribute('lang', 'it');
      rpOpzioni(ctx, opts, v.en, ok=>{
        grade(v.id, ok);
        speak(parolaConArticolo(v));
        card.appendChild(azioniTesto(v.it, v.en, {pos:v.pos, tag:v.tag}));
        ctx.fatto(ok?1:0, 1);
      });
      return;
    }
    const itFront = flashDir()!=='en-it';
    const {flip, itTxt} = flashCardEl(v, itFront);
    const reveal = $(`<button class="btn block" type="button">${ic('rotate')} Show the answer <span class="kbd-hint">space</span></button>`);
    const controls = $(`<div class="grade-row hidden"><button class="btn bad" type="button">${ic('x')} Again <span class="kbd-hint">1</span></button><button class="btn good" type="button">${ic('check')} I knew it <span class="kbd-hint">2</span></button></div>`);
    const acts = azioniTesto(v.it, v.en, {pos:v.pos, tag:v.tag});
    acts.classList.add('hidden');
    let girata = false, votata = false;
    const gira = ()=>{ if(girata) return; girata = true; flip.classList.add('flipped'); reveal.classList.add('hidden'); controls.classList.remove('hidden'); acts.classList.remove('hidden'); if(!itFront) setTimeout(()=>speak(itTxt), 200); };
    const vota = ok=>{ if(!girata || votata) return; votata = true; haptic(ok); grade(v.id, ok); ctx.fatto(ok?1:0, 1, true); };
    flip.onclick = gira; reveal.onclick = gira;
    controls.children[0].onclick = ()=>vota(false);
    controls.children[1].onclick = ()=>vota(true);
    ctx.wrap.append(flip, reveal, controls, acts);
    ctx.keys(e=>{
      if(e.key===' ' || e.key==='Enter'){ if(!girata){ e.preventDefault(); gira(); } return; }
      if(e.key==='1' || e.key==='ArrowLeft') vota(false);
      else if(e.key==='2' || e.key==='ArrowRight') vota(true);
    });
    if(itFront) setTimeout(()=>speak(itTxt), 150);
  },

  // verb of the day: first study its tense, then three forms to recognise
  verbo(it, ctx){
    const v = (DB.verbi||[]).find(x=>x.inf===it.inf);
    const tk = it.tk || 'indic.pres';
    if(!v || !(v.coniugazioni[tk]||[]).filter(Boolean).length) return false;
    ctx.kick.querySelector('span').textContent = `✏️ Verb of the day · ${tenseLabel(tk)}`;
    const card = $(`<div class="qcard"><div class="q" lang="it"></div><div class="big-en" style="font-size:19px"></div><div class="qsub"></div>
      <button class="btn soft sm listen-btn" type="button">${ic('vol')} Listen</button></div>`);
    card.querySelector('.q').textContent = v.inf;
    card.querySelector('.big-en').textContent = v.en || '';
    card.querySelector('.qsub').textContent = `Today: ${tenseLabel(tk)} (${tenseInfo(tk).en})`;
    card.querySelector('.listen-btn').onclick = ()=>speak(v.inf);
    ctx.wrap.appendChild(card);
    const tab = $(`<div class="pcard"><h3>${ic('rules')} Study its forms</h3></div>`);
    tab.appendChild(makeVerbConjBlock(v, false, tk));
    ctx.wrap.appendChild(tab);
    ctx.wrap.appendChild(azioniTesto(v.inf, v.en, {verbo:v}));
    const via = $(`<button class="btn primary block" type="button">${ic('play')} Ready: test me</button>`);
    ctx.wrap.appendChild(via);
    setTimeout(()=>speak(v.inf), 150);
    const persone = [0,1,2,3,4,5].filter(p=>(v.coniugazioni[tk]||[])[p]);
    const domande = sample(persone, 2).map(p=>({tk, p}));
    const altro = ['indic.passpross','cong.pres','cond.pres','indic.imperf'].find(t=>t!==tk && conjForm(v, t, 2));
    domande.push(altro ? {tk:altro, p:rnd(0,5)} : {tk, p:persone.find(p=>!domande.some(d=>d.p===p))});
    let i = 0, giuste = 0;
    function domanda(){
      const d = domande[i];
      const cell = conjForm(v, d.tk, d.p);
      if(!cell){ i++; return i<domande.length ? domanda() : ctx.fatto(giuste, Math.max(1,i)); }
      const giusta = cell.display;
      const altre = [0,1,2,3,4,5].map(p=>conjForm(v, d.tk, p)).filter(Boolean).map(c=>c.display)
        .concat(['cong.pres','indic.pres','cond.pres','indic.imperf','indic.futuro'].map(t=>conjForm(v, t, d.p)).filter(Boolean).map(c=>c.display));
      ctx.wrap.innerHTML = '';
      ctx.kick.querySelector('span').textContent = `✏️ Verb of the day · ${i+1} of ${domande.length}`;
      ctx.wrap.appendChild(ctx.kick);
      const c = $(`<div class="qcard"><div class="kick"></div><div class="blank"><span class="pron"></span><span class="line"></span></div><div class="qsub"></div></div>`);
      c.querySelector('.kick').textContent = tenseLabel(d.tk);
      c.querySelector('.pron').textContent = conjPronoun(d.tk, d.p);
      c.querySelector('.qsub').textContent = `${v.inf} — ${v.en}`;
      ctx.wrap.appendChild(c);
      rpOpzioni(ctx, shuffle([giusta, ...rpDistr(giusta, altre)]), giusta, ok=>{
        grade(`conj:${v.inf}:${d.tk}:${d.p}`, ok);
        if(ok) giuste++;
        speak(giusta);
        c.querySelector('.line').replaceWith(Object.assign(document.createElement('span'), {textContent:giusta, style:'color:var(--good)'}));
        i++;
        if(i < domande.length){
          const nx = $(`<button class="btn primary block" type="button">Next form →</button>`);

        } else {

    via.onclick = domanda;
    ctx.keys(e=>{ if(e.key==='Enter'){ e.preventDefault(); domanda(); } });
  },

  componi(it, ctx){
    const f = (DB.frasi||[]).find(x=>x.id===it.id);
    if(!f) return false;
    const giuste = paroleComponi(f.it);
    if(giuste.length < 2) return false;
    let chips = giuste.map((w,k)=>({w,k}));
    for(let g=0; g<8; g++){ chips = shuffle(chips); if(chips.some((c,j)=>c.w!==giuste[j])) break; }
    const scelte = [];
    const card = $(`<div class="qcard"><div class="kick">Translate into Italian</div><div class="big-en"></div><button class="btn soft sm listen-btn" type="button">${ic('vol')} Hint: listen</button></div>`);
    card.querySelector('.big-en').textContent = f.en;
    card.querySelector('.big-en').style.fontSize = Math.max(18, 25 - Math.max(0, f.en.length-28)*0.25) + 'px';
    card.querySelector('.listen-btn').onclick = ()=>speak(f.it);
    const line = $(`<div class="cmp-line"><span class="ph">Tap the words below</span></div>`);
    const bank = $(`<div class="cmp-bank"></div>`);
    const chk = $(`<button class="btn primary block" type="button" disabled>${ic('check')} Check</button>`);
    ctx.wrap.append(card, line, bank, chk);
    let answered = false;
    const bankBtns = chips.map((c, j)=>{
      const b = $(`<button class="chipw" type="button"></button>`);
      b.textContent = c.w;
      b.onclick = ()=>{ if(answered || b.classList.contains('used')) return; b.classList.add('used'); scelte.push(j); paint(); };
      bank.appendChild(b);
      return b;
    });
    function paint(){
      line.innerHTML = '';
      if(!scelte.length) line.appendChild($(`<span class="ph">Tap the words below</span>`));
      scelte.forEach((j, p)=>{ const b = $(`<button class="chipw" type="button"></button>`); b.textContent = chips[j].w; b.onclick = ()=>{ if(answered) return; scelte.splice(p, 1); bankBtns[j].classList.remove('used'); paint(); }; line.appendChild(b); });
      chk.disabled = scelte.length !== chips.length;
    }
    chk.onclick = ()=>{
      if(answered || scelte.length !== chips.length) return;
      answered = true;
      const ok = scelte.every((j, p)=>chips[j].w.toLowerCase() === giuste[p].toLowerCase());
      haptic(ok); contaExtra('cmp', ok);
      if(!ok) logErrore(f.it, f.en, 'Compose');
      grade(f.id, ok);
      line.classList.add(ok ? 'ok' : 'ko');
      bank.style.display = 'none'; chk.remove();
      const sol = $(`<div class="cmp-sol"><div class="lab"></div><div class="it"></div></div>`);
      sol.querySelector('.lab').textContent = ok ? '✓ Perfetto!' : 'The right sentence:';
      sol.querySelector('.lab').style.color = ok ? 'var(--good)' : 'var(--bad)';
      sol.querySelector('.it').textContent = f.it;
      sol.onclick = ()=>speak(f.it);
      ctx.wrap.append(sol, azioniTesto(f.it, f.en));
      speak(f.it);
      ctx.fatto(ok?1:0, 1);
    };
    ctx.keys(e=>{
      if(answered) return;
      if(e.key==='Enter'){ if(!chk.disabled){ e.preventDefault(); chk.click(); } return; }
      if(e.key==='Backspace' && scelte.length){ e.preventDefault(); bankBtns[scelte.pop()].classList.remove('used'); paint(); return; }
      const k = parseInt(e.key, 10);
      if(k>=1 && k<=9){ const free = bankBtns.filter(b=>!b.classList.contains('used')); if(free[k-1]) free[k-1].click(); }
