  completa(it, ctx){
    const f = (DB.frasi||[]).find(x=>x.id===it.id);
    if(!f) return false;
    const raw = f.it.split(' ');
    const clean = raw.map(w=>w.replace(/^[«"“(]+|[.,!?;:»”")…]+$/g,'').replace(/^[a-zà-ÿ]+'/i,''));
    let cand = clean.map((w,idx)=>({w,idx})).filter(x=>pienaIt(x.w));
    if(!cand.length) return false;
    const {w:giusta, idx} = cand[rnd(0, cand.length-1)];
    const corpus = [...new Set((DB.frasi||[]).flatMap(x=>tokenizza(x.it)).filter(pienaIt))].filter(w=>!clean.includes(w));
    const lo = giusta.toLowerCase(), rad = lo.slice(0, Math.min(4, lo.length-2));
    const verb = (indiceForme().get(lo)||[]).find(a=>a.cat==='verbo');
    const vForms = verb ? shuffle(Object.values(verb.verbo.coniugazioni||{}).flat().filter(x=>x && !/\s/.test(x) && x.toLowerCase()!==lo)).slice(0,2) : [];
    const distr = [...new Set(vForms)];
    for(const tier of [corpus.filter(w=>w.toLowerCase().startsWith(rad)), corpus.filter(w=>w.toLowerCase().slice(-3)===lo.slice(-3)), corpus.filter(w=>Math.abs(w.length-giusta.length)<=1), corpus]){
      for(const w of shuffle(tier)){ if(distr.length>=3) break; if(w.toLowerCase()!==lo && !distr.includes(w)) distr.push(w); }
      if(distr.length>=3) break;
    }
    const html = raw.map((w,k)=>k===idx ? esc(w.replace(giusta, '§')).replace('§', '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>') : esc(w)).join(' ');
    const card = rpCard(ctx, '', f.en, f.it, html);
    rpOpzioni(ctx, shuffle([giusta, ...distr.slice(0,3)]), giusta, ok=>{
      grade(f.id, ok);
      speak(f.it);
      card.querySelector('.q').innerHTML = raw.map((w,k)=>k===idx ? `<span style="color:var(--good)">${esc(w)}</span>` : esc(w)).join(' ');
      card.appendChild(azioniTesto(f.it, f.en));
      ctx.fatto(ok?1:0, 1);
    });
  },

  // a grammar-gym question (topic of the day)
  gym(it, ctx){
    const p = (DB.palestra||[]).find(x=>x.id===it.g);
    const d = p && (p.domande||[])[it.k];
    if(!d) return false;
    ctx.kick.querySelector('span').textContent = `🏋️ ${p.titolo}`;
    const card = rpCard(ctx, '', d.en, null, gapHtml(d.f, null));
    rpOpzioni(ctx, shuffle([d.ok, ...d.no]), d.ok, ok=>{
      const intera = d.f.replace('___', d.ok);
      recordActivity(ok);
      if(!ok) logErrore(intera, d.en, p.titolo);
      card.querySelector('.q').innerHTML = gapHtml(d.f, d.ok);
      speak(intera);
      rpNota(card, esc(d.perche||''));
      card.appendChild(azioniTesto(intera, d.en));
      const l = $(`<button class="textbtn" type="button">${ic('dumbbell')} More: ${esc(p.titolo)}</button>`);
      l.onclick = ()=>navigateTo(()=>runGymTopic(p));
      card.appendChild(l);
      ctx.fatto(ok?1:0, 1);
    });
  },

  articolo(it, ctx){
    const n = ARTICOLI_NOMI[it.k];
    if(!n) return false;
    const pl = it.pl && n.pl;
    const giusta = pl ? n.defPl : n.def;
    const opts = pl ? ['i','gli','le'] : ['il','lo','la',"l'"];
    const parola = pl ? n.pl : n.it;
    const card = rpCard(ctx, `___ ${parola}`, `${pl ? n.enPl || n.en+' (plural)' : n.en} · choose the definite article`, null);
    rpOpzioni(ctx, opts, giusta, ok=>{
      recordActivity(ok);
      const frase = giusta.endsWith("'") ? giusta + parola : `${giusta} ${parola}`;
      if(!ok) logErrore(frase, n.en, 'Articles');
      card.querySelector('.q').textContent = frase;
      speak(frase);
      rpNota(card, esc(n.perche || regolaArticolo(parola, n.g, pl)));
      ctx.fatto(ok?1:0, 1);
    });
  },

  dialogo(it, ctx){
    const d = (DB.dialoghi||[]).find(x=>x.id===it.d);
    const b = d && d.battute[it.k], prima = d && d.battute[it.k-1];
    if(!b || !prima) return false;
    const mio = dlgMio(d);
    const stesse = d.battute.filter(x=>x.s===mio && x.it!==b.it).map(x=>x.it);
    const altrove = (DB.dialoghi||[]).filter(x=>x.id!==d.id).flatMap(x=>x.battute.filter(y=>y.s===dlgMio(x)).map(y=>y.it));
    const distr = [...new Set([...shuffle(stesse), ...shuffle(altrove)])].filter(x=>x!==b.it).slice(0,3);
    ctx.kick.querySelector('span').textContent = `🎭 ${d.titolo} · what do you answer?`;
    const card = rpCard(ctx, prima.it, `«${prima.en}»`, prima.it);
    setTimeout(()=>speak(prima.it), 200);
    rpOpzioni(ctx, shuffle([b.it, ...distr]), b.it, ok=>{
      recordActivity(ok);
      if(!ok) logErrore(b.it, b.en, 'Dialogues');
      speak(b.it);
      rpNota(card, esc(b.en));
      card.appendChild(azioniTesto(b.it, b.en));
      const l = $(`<button class="textbtn" type="button">${ic('play')} Open the dialogue</button>`);
      l.onclick = ()=>navigateTo(()=>runDialogo(d));
      card.appendChild(l);
      ctx.fatto(ok?1:0, 1);
    });
  },

  proverbio(it, ctx){
    const P = DB.proverbi || [], p = P[it.k];
    if(!p) return false;
    const altre = P.filter(x=>x.en && x.en!==p.en).map(x=>x.en);
    if(altre.length < 3) return false;
    const card = rpCard(ctx, p.it, 'Which English saying is closest?', p.it);
    rpOpzioni(ctx, shuffle([p.en, ...rpDistr(p.en, altre)]), p.en, ok=>{
      recordActivity(ok);
      if(!ok) logErrore(p.it, p.en, 'Proverbs');
      rpNota(card, `Literally: «${esc(p.lett)}»${p.sig ? `<br>${esc(p.sig)}` : ''}`);
      card.appendChild(azioniTesto(p.it, p.en));
      ctx.fatto(ok?1:0, 1);
    });
  },

  idioma(it, ctx){
    const all = (DB.modididire||[]).flatMap(c=>c.espressioni||[]);
    const e = all[it.k];
    if(!e) return false;
    const giusta = e.en || e.sig;
    const altre = all.filter(x=>x!==e).map(x=>x.en || x.sig);
    const card = rpCard(ctx, e.it, 'What does it mean?', e.it);
    rpOpzioni(ctx, shuffle([giusta, ...rpDistr(giusta, altre)]), giusta, ok=>{
      recordActivity(ok);
      if(!ok) logErrore(e.it, giusta, 'Idioms');
      rpNota(card, `${e.lett ? `Literally: «${esc(e.lett)}»<br>` : ''}${e.esempio ? `«${esc(e.esempio)}»` : ''}`);
      card.appendChild(azioniTesto(e.it, giusta));
      ctx.fatto(ok?1:0, 1);
    });
  },

  falsoamico(it, ctx){
    const F = DB.falsiAmici || [], f = F[it.k];
    if(!f) return false;
    const giusta = f.en;
    const opts = shuffle([giusta, f.sembra, ...rpDistr(giusta, F.filter(x=>x!==f).map(x=>x.en), 2)]);
    const card = rpCard(ctx, f.it, 'What does it really mean?', f.it);
    rpOpzioni(ctx, opts, giusta, ok=>{
      recordActivity(ok);
      if(!ok) logErrore(f.it, f.en, 'False friends');
      rpNota(card, `False friend: it looks like «${esc(f.sembra)}», but it isn't!${f.nota ? '<br>' + esc(f.nota) : ''}${f.es ? `<br><i>«${esc(f.es)}»</i>` : ''}`);
      card.appendChild(azioniTesto(f.es || f.it, f.en));
      ctx.fatto(ok?1:0, 1);
    });
  },

  luogo(it, ctx){
    const L = DB.luoghi || [], l = L.find(x=>x.id===it.id);
    if(!l) return false;
    const stesso = L.filter(x=>x.cat===l.cat && x.id!==l.id);
    ctx.kick.querySelector('span').textContent = l.cat==='cibo' ? '🍝 Italy atlas · food' : l.cat==='natura' ? '🏔️ Italy atlas · landscapes' : '📍 Italy atlas · monuments';
    const q = indovinello(l);
    const card = rpCard(ctx, q.q, q.sub);
    rpOpzioni(ctx, shuffle([q.ok, ...rpDistr(q.ok, q.altre(stesso))]), q.ok, ok=>{
      recordActivity(ok);
      if(!ok) logErrore(l.nome, l.dove, 'Italy atlas');
      const art = $(`<div class="atl-art" style="width:100%;border-radius:14px">${illIMG(l.ill)}</div>`);
      card.prepend(art);
      rpNota(card, `<b>${esc(l.nome)}</b> — ${esc(l.dove)}`);
      const a = $(`<button class="textbtn" type="button">${ic('landmark')} Read about it</button>`);
      a.onclick = ()=>navigateTo(()=>runLuogo(l));
      card.appendChild(a);
      ctx.fatto(ok?1:0, 1);
    });
  },
};

// =====================================================================
// DIALOGUES: real-life scenes (the bar, the doctor, a job interview, a
// condominium meeting…). Heard with two voices, read with the translation,
// then performed: the phone plays the other part, you say yours.
// =====================================================================
function dlgStato(id){ return ((extraStore().dlg)||{})[id] || {}; }
function segnaDialogo(id, campo){
  updExtra(s=>{ s.dlg = s.dlg || {}; const d = s.dlg[id] || {}; d[campo] = (d[campo]||0) + 1; s.dlg[id] = d; });
}
// "my" part: the one called «Tu»; if both parts have a name, part B
function dlgMio(d){ const r = d.ruoli || {}; return r.A === "Tu" ? "A" : "B"; }
function nomeRuolo(d, r){ const n = (d.ruoli||{})[r] || r; return n === "Tu" ? "You" : n; }
const DLG_LIVELLI = [[1,'B2 · everyday life'],[2,'C1 · formal, tricky, fast']];

function runDialoghi(){
  const stage = header('Dialogues');
  const all = DB.dialoghi || [];
  stage.appendChild($(`<p class="sg-intro">Scenes from Italian life: <b>listen</b> with two voices, read the translation, then <b>play a part</b> — the phone plays the other one. Tap a line to hear it again.</p>`));
  if(!all.length){ stage.appendChild($(`<div class="empty"><div class="big">💬</div>No dialogues yet.</div>`)); return; }
  const recitati = all.filter(d=>dlgStato(d.id).r).length;
  const pct = Math.round(recitati/all.length*100);
  stage.appendChild($(`<div class="pcard dlg-prog">
    <div><b>${recitati} / ${all.length}</b> <span>dialogues performed</span></div>
    <div class="pbar"><i style="width:${pct}%;background:var(--good)"></i></div></div>`));
  DLG_LIVELLI.forEach(([lv, lab])=>{
    const items = all.filter(d=>(d.livello||1)===lv);
    if(!items.length) return;
    stage.appendChild($(`<div class="sec-h">${lab}</div>`));
    const list = $(`<div class="list"></div>`);
    items.forEach(d=>list.appendChild(dlgTile(d)));
    stage.appendChild(list);
  });
}
function dlgTile(d){
  const st = dlgStato(d.id);
  const badge = st.r ? `<span class="pill green">${ic('check')} Performed</span>`
              : st.a ? `<span class="pill blue">Heard</span>` : '';
  const t = $(`<button class="tile wide" type="button"><div class="ico">${d.icona||'💬'}</div>
    <div class="txt"><div class="t"><span></span> <span class="tit"></span></div><div class="d"></div></div>${badge?`<div class="right">${badge}</div>`:''}</button>`);
  t.querySelector('.t span').textContent = d.titolo;
  t.querySelector('.tit').textContent = d.titoloIt || '';
  t.querySelector('.d').textContent = d.scena || '';
  t.onclick = ()=>navigateTo(()=>runDialogo(d));
  return t;
}

function runDialogo(d){
  const stage = header(d.titolo, {narrow:true});
  const mio = dlgMio(d);

  const hero = $(`<div class="dlg-hero"><div class="e">${d.icona||'💬'}</div>
    <div class="tx"><button class="it" type="button" title="Listen"><span></span>${ic('vol')}</button><p></p></div></div>`);
  hero.querySelector('.it span').textContent = d.titoloIt || d.titolo;
  hero.querySelector('p').textContent = d.scena || '';
  hero.querySelector('.it').onclick = ()=>{ stopPlay(); speak(d.titoloIt || d.titolo); };
  stage.appendChild(hero);

  const bar = $(`<div class="dlg-bar"></div>`);
  const playBtn = $(`<button class="btn blue sm" type="button"></button>`);
  const slowBtn = $(`<button class="btn soft sm" type="button">🐢 Slowly</button>`);
  const trBtn = $(`<button class="btn soft sm" type="button"></button>`);
  bar.append(playBtn, slowBtn, trBtn);
  stage.appendChild(bar);

  const chat = $(`<div class="chat"></div>`);
  const bubs = d.battute.map((b,k)=>{
    const el = $(`<div class="bub${b.s===mio?' me':''}" role="button" tabindex="0"><div class="who"><span></span></div><div class="it" lang="it"></div><div class="en"></div></div>`);
    el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
    el.querySelector('.who').appendChild(lensBtn(b.it, b.en, {tema:`Dialogue: ${d.titolo}`}));
    el.querySelector('.it').textContent = b.it;
    el.querySelector('.en').textContent = b.en;
    el.style.animationDelay = Math.min(k*35, 400) + 'ms';
    el.onclick = ()=>{ stopPlay(); mark(k); speakAs(b.it, b.s, ()=>mark(-1)); };
    el.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.onclick(); } };
    chat.appendChild(el);
    return el;
  });
  stage.appendChild(chat);

  // translation shown or hidden (the choice is remembered)
  let showEn = settings().dlgEn !== false;
  function paintTr(){
    chat.classList.toggle('no-en', !showEn);
    trBtn.innerHTML = `${ic('eye')} ${showEn ? 'Hide English' : 'Show English'}`;
  }
  trBtn.onclick = ()=>{ showEn = !showEn; setSetting('dlgEn', showEn); paintTr(); };
  paintTr();

  // play all: one line after the other, highlighted while it is spoken
  let playTok = 0, playing = false;
  function mark(k){ bubs.forEach((b,i)=>b.classList.toggle('playing', i===k)); }
  function paintPlay(){ playBtn.innerHTML = playing ? `${ic('stop')} Stop` : `${ic('play')} Play all`; }
  function stopPlay(){ playTok++; playing = false; mark(-1); paintPlay(); }
  function playAll(rate){
    const tok = ++playTok; playing = true; paintPlay();
    let k = 0;
    const step = ()=>{
      if(tok!==playTok) return;
      if(k>=d.battute.length){ playing = false; mark(-1); paintPlay(); segnaDialogo(d.id, 'a'); return; }
      mark(k);
      bubs[k].scrollIntoView({block:'nearest', behavior:'smooth'});
      const b = d.battute[k];
      speakAs(b.it, b.s, ()=>{ if(tok!==playTok) return; k++; setTimeout(step, 420); }, rate);
    };
    step();
  }
  playBtn.onclick = ()=>{ if(playing){ stopPlay(); stopSpeech(); } else playAll(); };
  slowBtn.onclick = ()=>{ stopPlay(); stopSpeech(); playAll(0.7); };
  paintPlay();
  onLeave(()=>{ playTok++; stopSpeech(); });

  // key phrases and cultural note
  if(d.parole && d.parole.length){
    const kw = $(`<div class="pcard"><h3>${ic('key')} Key phrases</h3><div class="kw-list"></div></div>`);
    d.parole.forEach(p=>kw.querySelector('.kw-list').appendChild(kwRow(p.it, p.en, {tema:`Dialogue: ${d.titolo}`})));
    stage.appendChild(kw);
  }
  if(d.nota) stage.appendChild($(`<div class="nota-box">${ic('bulb')}<div>${esc(d.nota)}</div></div>`));

  // test yourself
  stage.appendChild($(`<div class="sec-h">Test yourself</div>`));
  const list = $(`<div class="list"></div>`);
  [mio, mio==='A'?'B':'A'].forEach(r=>{
    const nome = nomeRuolo(d, r);
    const t = $(`<button class="tile wide" type="button"><div class="ico">${r===mio?'🎭':'🔁'}</div>
      <div class="txt"><div class="t"></div><div class="d"></div></div></button>`);
    t.querySelector('.t').textContent = nome==='You' ? 'Play your part' : `Play the part of ${nome}`;
    t.querySelector('.d').textContent = `The other speaks, you answer in Italian${SpeechRec?' (out loud: the phone listens)':''}`;
    t.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runRecita(d, r)); };
    list.appendChild(t);
  });
  const quiz = $(`<button class="tile wide" type="button"><div class="ico">💡</div>
    <div class="txt"><div class="t">What do you answer?</div><div class="d">Pick the right line to carry on the conversation</div></div></button>`);
  quiz.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runDlgQuiz(d)); };
  list.appendChild(quiz);
  stage.appendChild(list);

  // my lines in My exercises (Sentences tab)
  const mie = d.battute.map((b,k)=>({b,k})).filter(({b})=>b.s===mio && tokenizza(b.it).length>=3)
    .map(({b,k})=>({id:`d-${d.id}-${k}`, it:b.it, en:b.en, tema:`Dialogue: ${d.titolo}`}));
  if(mie.length){
    const save = $(`<button class="add-flash-btn" type="button" style="align-self:center"></button>`);
    const paint = ()=>{
      const tutte = mie.every(f=>isEsesFrase(fraseEseId(f)));
      save.innerHTML = tutte ? `${ic('check')} Your lines are in My exercises` : `${ic('plus')} Save your ${mie.length} lines to My exercises`;
      save.classList.toggle('added', tutte); save.disabled = tutte;
    };
    save.onclick = ()=>{ mie.forEach(f=>addEsesFrase(f)); paint(); haptic(true); };
    paint();
    stage.appendChild(save);
  }
}

// Performing: the phone reads the other part, you say yours.
function runRecita(d, ruolo){
  const stage = header(`Perform · ${d.titolo}`, {narrow:true});
  const nome = nomeRuolo(d, ruolo);
  stage.appendChild($(`<p class="sg-intro">${nome==='You' ? 'Play your part' : `You are <b>${esc(nome)}</b>`}: when it is your turn, read the English and say it in Italian${SpeechRec ? ' — tap <b>Speak</b> and the phone listens' : ' out loud'}. Then check.</p>`));
  const bar = progressBar(stage);
  const chat = $(`<div class="chat"></div>`); stage.appendChild(chat);
  const ctrl = $(`<div class="rp-ctrl"></div>`); stage.appendChild(ctrl);
  const n = d.battute.length;
  let k = 0, tok = 0, rec = null, parlate = 0, capite = 0;
  const stopRec = ()=>{ if(rec){ try{ rec.abort(); }catch(e){} rec = null; } };
  onLeave(()=>{ tok++; stopSpeech(); stopRec(); });
  const scorri = el => requestAnimationFrame(()=>el.scrollIntoView({block:'center', behavior:'smooth'}));

  function bolla(b, mia){
    const el = $(`<div class="bub${mia?' me':''}"><div class="who"><span></span></div><div class="it" lang="it"></div><div class="en"></div></div>`);
    el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
    el.querySelector('.who').appendChild(lensBtn(b.it, b.en));
    el.querySelector('.it').textContent = b.it;
    el.querySelector('.en').textContent = b.en;
    return el;
  }
  function next(){
    const my = ++tok;
    bar.style.width = (k/n*100)+'%'; bar.setNum(Math.min(k, n-1), n);
    ctrl.innerHTML = '';
    if(k>=n) return fine();
    const b = d.battute[k];
    if(b.s !== ruolo){
      const el = bolla(b, false);
      el.classList.add('playing');
      chat.appendChild(el); scorri(el);
      const salta = $(`<button class="textbtn" type="button" style="align-self:center">Skip ›</button>`);
      salta.onclick = ()=>{ stopSpeech(); el.classList.remove('playing'); k++; next(); };
      ctrl.appendChild(salta);
      speakAs(b.it, b.s, ()=>{ if(my!==tok) return; el.classList.remove('playing'); k++; setTimeout(()=>{ if(my===tok) next(); }, 380); });
      return;
    }
    // your turn
    const el = $(`<div class="bub me turn"><div class="who"></div><div class="hint"></div><div class="heard"></div></div>`);
    el.querySelector('.who').textContent = `${nomeRuolo(d, b.s)} · your turn`;
    el.querySelector('.hint').textContent = `«${b.en}»`;
    chat.appendChild(el); scorri(el);
    const row = $(`<div class="row"></div>`);
    const show = $(`<button class="btn" type="button">${ic('eye')} Show</button>`);
    show.onclick = ()=>rivela(null);
    if(SpeechRec){
      const mic = $(`<button class="btn blue" type="button">${ic('mic')} Speak</button>`);
      mic.onclick = ()=>{
        if(rec){ try{ rec.stop(); }catch(e){} return; }
        stopSpeech();
        mic.innerHTML = `${ic('stop')} Listening…`; mic.classList.add('rec');
        const heard = el.querySelector('.heard');
        rec = ascoltaItaliano((testo, err)=>{
          rec = null;
          if(my!==tok) return;
          mic.innerHTML = `${ic('mic')} Speak`; mic.classList.remove('rec');
          if(testo) rivela(testo);
          else heard.textContent = err==='not-allowed' || err==='service-not-allowed'
            ? 'Microphone not allowed: use «Show».' : 'I didn\'t hear you: try again or tap «Show».';
        }, parz=>{ heard.textContent = parz; });
      };
      row.append(mic, show);
    } else {
      show.classList.add('primary');
      row.append(show);
    }
    ctrl.appendChild(row);

    function rivela(detto){
      stopRec();
      el.classList.remove('turn');
      el.innerHTML = `<div class="who"><span></span></div><div class="it" lang="it"></div><div class="en"></div>`;
      el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
      el.querySelector('.who').appendChild(lensBtn(b.it, b.en));
      el.querySelector('.en').textContent = b.en;
      if(detto!=null){
        parlate++;
        const c = confrontaDetto(detto, b.it);
        const ok = c.pct >= 70;
        if(ok) capite++; else logErrore(b.it, b.en, 'Performing');
        haptic(ok);
        el.querySelector('.it').innerHTML = c.html;
        el.classList.add(ok ? 'good' : 'meh');
        const res = $(`<div class="sr-res"></div>`);
        res.textContent = `${ok ? '✓ Bravo!' : 'Almost.'} You said: «${detto}»`;
        el.appendChild(res);
      } else {
        el.querySelector('.it').textContent = b.it;
      }
      speakAs(b.it, b.s);
      ctrl.innerHTML = '';
      const go = $(`<button class="btn primary block" type="button">${k+1<n?'Continue':'Finish'} →</button>`);
      go.onclick = ()=>{ k++; next(); };
      ctrl.appendChild(go);
    }
  }
  function fine(){
    segnaDialogo(d.id, 'r');
    addXP(40);
    recordActivity(true);
    const testo = parlate
      ? `The phone understood ${capite} ${capite===1?'line':'lines'} out of ${parlate}.`
      : `You performed every line of «${nomeRuolo(d, ruolo)}».`;
    finish(stage, 'Dialogue complete!', ()=>runRecita(d, ruolo), {titolo:'Dialogue complete! 🎭', testo});
    confetti(stage.querySelector('.done'));
    const altro = ruolo==='A' ? 'B' : 'A';
    const sw = $(`<button class="textbtn" type="button" style="align-self:center">${ic('users')} Now play ${esc(nomeRuolo(d, altro)==='You' ? 'your own part' : 'the part of ' + nomeRuolo(d, altro))}</button>`);
    sw.onclick = ()=>runRecita(d, altro);
    stage.appendChild(sw);
  }
  next();
}

// «What do you answer?»: the other person's line, then four possible answers
function runDlgQuiz(d){
  const mio = dlgMio(d);
  const mieAltrove = (DB.dialoghi||[]).filter(x=>x.id!==d.id)
    .flatMap(x=>x.battute.filter(b=>b.s===dlgMio(x)).map(b=>b.it));
  const qs = [];
  d.battute.forEach((b,k)=>{
    if(k===0 || b.s!==mio || d.battute[k-1].s===mio) return;
    const prima = d.battute[k-1];
    const stesse = d.battute.filter((x,j)=>j!==k && x.s===mio && x.it!==b.it).map(x=>x.it);
    const distr = [...new Set([...shuffle(stesse), ...shuffle(mieAltrove)])].filter(x=>x!==b.it).slice(0,3);
    qs.push({q:prima.it, sub:`«${prima.en}» — what do you answer?`, correct:b.it, opts:shuffle([b.it, ...distr]),
             listen:prima.it, speak:b.it, after:esc(b.en), err:{it:b.it, en:b.en, fonte:'Dialogues'}});
  });
  runMCQ(qs, `What do you answer? · ${d.titolo}`, ()=>runDlgQuiz(d), {
    onAnswer:(Q, ok)=>recordActivity(ok),
    onEnd:()=>segnaDialogo(d.id, 'q')
  });
}

// =====================================================================
// PHRASEBOOK: ready-made phrases by situation, each with its register
// (formal / informal) — at C1 knowing *when* to say something matters as
// much as knowing how. Plus the key phrases of the dialogues.
// =====================================================================
const FRASARIO_CAT = [
  ['opinioni','💭','Giving your opinion'],
  ['accordo','🤝','Agreeing and disagreeing'],
  ['discussione','🗣️','Debating and arguing'],
  ['formale','🎩','Formal letters and emails'],
  ['lavoro','💼','Work and meetings'],
  ['burocrazia','🏛️','Offices and bureaucracy'],
  ['telefono','📞','On the phone'],
  ['tavola','🍝','At the table'],
  ['viaggio','🚆','Travelling'],
  ['emozioni','❤️','Feelings and reactions'],
  ['salute','💊','Health'],
  ['colloquiale','😎','Colloquial Italian'],
  ['dialoghi','🎭','From the dialogues'],
];
const REG_EN = {formale:'formal', informale:'informal', neutro:'neutral'};
function frasarioItems(){
  const out = (DB.frasario||[]).map((f,k)=>({id:f.id || `fr${k}`, it:f.it, en:f.en, cat:f.cat, reg:f.reg, nota:f.nota}));
  (DB.dialoghi||[]).forEach(d=>(d.parole||[]).forEach((p,k)=>
    out.push({id:`dp-${d.id}-${k}`, it:p.it, en:p.en, cat:'dialoghi', dlg:d})));
  return out;
}
function fraseRow(f, tema, opts){
  opts = opts || {};
  const row = $(`<div class="fr-item"><div class="txt"><div class="it" lang="it"></div><div class="en"></div></div></div>`);
  row.querySelector('.it').textContent = f.it;
  row.querySelector('.en').textContent = f.en || '';
  if(f.nota){ const n = $(`<div class="nt"></div>`); n.textContent = f.nota; row.querySelector('.txt').appendChild(n); }
  if(f.reg && REG_EN[f.reg]){ const r = $(`<span class="reg ${f.reg}"></span>`); r.textContent = REG_EN[f.reg]; row.querySelector('.txt').appendChild(r); }
  if(f.dlg){
    const src = $(`<button class="fr-src" type="button"></button>`);
    src.textContent = `${f.dlg.icona||'💬'} ${f.dlg.titolo}`;
    src.onclick = e=>{ e.stopPropagation(); navigateTo(()=>runDialogo(f.dlg)); };
    row.querySelector('.txt').appendChild(src);
  }
  row.append(lensBtn(f.it, f.en, {tema}), spkMini(f.it));
  if(!opts.noAdd) row.appendChild(saveMini(f.it, f.en, {tema:tema||''}));
  row.onclick = ()=>speak(f.it);
  return row;
}
function runFrasario(){
  const stage = header('Phrasebook');
  const items = frasarioItems();
  stage.appendChild($(`<p class="sg-intro">Ready-made phrases for every situation, each marked <span class="reg formale">formal</span> <span class="reg informale">informal</span> or <span class="reg neutro">neutral</span>. Tap to listen, <b>＋</b> to train it.</p>`));
  const sWrap = $(`<div class="search sticky">${ic('search')}<input class="vocab-input" type="search" enterkeyhint="search" placeholder="Search a phrase, in Italian or English…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>`);
  const inp = sWrap.querySelector('input');
  stage.appendChild(sWrap);
  const browse = $(`<div class="list" style="gap:12px"></div>`);
  const results = $(`<div class="list" style="display:none;gap:8px"></div>`);
  stage.append(browse, results);

  const grid = $(`<div class="topic-grid"></div>`);
  FRASARIO_CAT.forEach(cat=>{
    const n = items.filter(f=>f.cat===cat[0]).length;
    if(!n) return;
    const b = $(`<button class="topic" type="button"><span class="e">${cat[1]}</span><span class="tt"><b></b><small>${plur(n,'phrase','phrases')}</small></span></button>`);
    b.querySelector('b').textContent = cat[2];
    b.onclick = ()=>navigateTo(()=>runFrasarioCat(cat));
    grid.appendChild(b);
  });
  browse.appendChild($(`<div class="sec-h">Situations</div>`));
  browse.appendChild(grid);

  let t = null;
  inp.oninput = ()=>{ clearTimeout(t); t = setTimeout(cerca, 120); };
  function cerca(){
    const q = normSearch(inp.value);
    if(!q){ results.style.display='none'; browse.style.display=''; return; }
    const found = items.filter(f=>normSearch(f.it).includes(q) || normSearch(f.en).includes(q));
    results.innerHTML = '';
    results.appendChild($(`<div class="results-hdr">${plur(found.length,'phrase found','phrases found')}</div>`));
    if(!found.length) results.appendChild($(`<div class="empty"><div class="big">🔍</div>No phrase with «${esc(inp.value.trim())}».<small>Try a single word, or search the <b>Vocabulary</b>.</small></div>`));
    found.slice(0, 60).forEach(f=>results.appendChild(fraseRow(f, 'Phrasebook')));
    results.style.display=''; browse.style.display='none';
  }
}
function runFrasarioCat(cat){
  const stage = header(cat[2]);
  const frasi = frasarioItems().filter(f=>f.cat===cat[0]);
  const pool = frasi.map(f=>({id:f.id, it:f.it, en:f.en}));
  const row = $(`<div class="row"></div>`);
  const ascolta = $(`<button class="btn primary" type="button">${ic('headphones')} Listen &amp; complete</button>`);
  ascolta.onclick = ()=>navigateTo(()=>runPhrase(0, {pool:sample(pool, Math.min(10, pool.length)), titolo:cat[2]}));
  const comp = $(`<button class="btn" type="button">${ic('blocks')} Compose</button>`);
  comp.onclick = ()=>navigateTo(()=>runComponi(null, {pool, titolo:cat[2]}));
  row.append(ascolta, comp);
  stage.appendChild(row);
  // formal and informal side by side, when the category has both
  const regs = ['formale','neutro','informale'].filter(r=>frasi.some(f=>f.reg===r));
  let filtro = 'tutte';
  const seg = regs.length > 1 ? $(`<div class="seg sm center"><button type="button" data-r="tutte" class="on">All</button>${regs.map(r=>`<button type="button" data-r="${r}">${REG_EN[r]}</button>`).join('')}</div>`) : null;
  if(seg) stage.appendChild(seg);
  const hdr = $(`<div class="sec-h"></div>`);
  const list = $(`<div class="list" style="gap:8px"></div>`);
  stage.append(hdr, list);
  function paint(){
    const vis = frasi.filter(f=>filtro==='tutte' || f.reg===filtro);
    hdr.textContent = `${cat[1]} ${plur(vis.length,'phrase','phrases')}`;
    list.innerHTML = '';
    vis.forEach(f=>list.appendChild(fraseRow(f, cat[2])));
  }
  if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick = ()=>{ filtro = b.dataset.r; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); paint(); });
  paint();
}

function letteStato(){ return extraStore().letture || {}; }
const LT_LIVELLI = [[1,'B2 · portraits of Italy'],[2,'C1 · essays, opinion, society']];

// text → words you can tap (elisions stay attached: «dell'», «po'»)
const RE_PAROLE = /[A-Za-zÀ-ÖØ-öø-ÿ]+['’]?|[^A-Za-zÀ-ÖØ-öø-ÿ]+/g;
function testoCliccabile(host, testo, onTap, isGloss){
  let prev;
  (String(testo).match(RE_PAROLE) || []).forEach(tok=>{
    if(!/[A-Za-zÀ-ÿ]/.test(tok)){ host.appendChild(document.createTextNode(tok)); if(/[.!?:;]/.test(tok)) prev = undefined; return; }
    const w = $(`<span class="lt-w" role="button" tabindex="0"></span>`);
    w.textContent = tok;
    const p = prev;
    if(isGloss && isGloss(tok)) w.classList.add('gl');
    w.onclick = e=>{ e.stopPropagation(); onTap(w, tok.replace(/’/g,"'"), p); };
    w.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); w.onclick(e); } };
    host.appendChild(w);
    prev = tok;
  });
}
function glossarioDi(l){
  const m = new Map();
  Object.entries((l && l.glossario)||{}).forEach(([k,v])=>m.set(normApo(k).toLowerCase(), v));
  return m;
}
function traduciParola(w, gl, prev){
  const r = analizzaParola(w, {glossario:gl, prev});
  const a = r.an[0];
  if(!a) return null;
  return {en: a.enCtx || a.en, an:a, desc: a.cat==='gloss' || a.cat==='nomep' ? '' : descriviAnalisi(a, '')};
}
// popover under a tapped word: translation, analysis, Listen / Explain / Save
function popParola(el, parola, opts){
  opts = opts || {};
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  document.querySelectorAll('.lt-w.on,.tutor-word.on').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  const tr = traduciParola(parola, opts.glossario, opts.prev);
  const pop = $(`<div class="pop" role="dialog"><b></b><div class="pop-en"></div><div class="pop-an"></div><div class="pop-row"></div></div>`);
  pop.querySelector('b').textContent = parola;
  pop.querySelector('.pop-en').textContent = tr ? tr.en : 'Not in the app\'s dictionary: see the translation of the sentence.';
  if(tr && tr.desc) pop.querySelector('.pop-an').textContent = tr.desc; else pop.querySelector('.pop-an').remove();
  const row = pop.querySelector('.pop-row');
  const chiudi = ()=>{ pop.remove(); el.classList.remove('on'); document.removeEventListener('pointerdown', fuori, true); };
  const sp = $(`<button type="button">🔊 Listen</button>`);
  sp.onclick = e=>{ e.stopPropagation(); speak(parola); };
  const sg = $(`<button type="button">🔍 Explain</button>`);
  sg.onclick = e=>{ e.stopPropagation(); chiudi(); sheetApri('The word', ()=>pagParola(parola, tr ? tr.en : '', {glossario:opts.glossario, prev:opts.prev})); };
  row.append(sp, sg);
  if(tr && tr.an.cat!=='nomep' && !['art','prep'].includes(tr.an.cat)){
    const lemma = tr.an.cat==='gloss' ? parola.toLowerCase() : tr.an.lemma;
    const add = $(`<button type="button"></button>`);
    const paint = ()=>{ const s = parolaSalvata(lemma); add.textContent = s ? '✓ Saved' : '＋ Save'; add.disabled = s; };
    add.onclick = e=>{
      e.stopPropagation();
      if(tr.an.cat==='verbo'){ salvaParola(tr.an.verbo.inf, tr.an.verbo.en, {pos:'verb'}); addEsesVerbo(tr.an.verbo.inf); }
      else salvaParola(lemma, tr.an.en || tr.en, {pos: tr.an.voce ? tr.an.voce.pos : '', tag: opts.tag || []});
      paint(); haptic(true);
      if(opts.onSave) opts.onSave();
    };
    paint();
    row.appendChild(add);
  }
  document.body.appendChild(pop);
  const rc = el.getBoundingClientRect();
  const pw = Math.min(300, window.innerWidth - 24);
  pop.style.maxWidth = pw + 'px';
  pop.style.left = Math.max(12, Math.min(window.innerWidth - pw - 12, rc.left + window.scrollX + rc.width/2 - pw/2)) + 'px';
  pop.style.top = (rc.bottom + window.scrollY + 8) + 'px';
  if(opts.speak !== false) speak(parola);
  const fuori = ev=>{ if(!pop.contains(ev.target) && ev.target!==el) chiudi(); };
  setTimeout(()=>document.addEventListener('pointerdown', fuori, true), 0);
  onLeave(()=>document.removeEventListener('pointerdown', fuori, true));
}

function letturaTile(l, onClick, badgeTxt){
  const fatte = letteStato();
  const badge = (badgeTxt ? badgeTxt(l) : fatte[l.id]) ? `<div class="right"><span class="pill green">${ic('check')} ${badgeTxt ? badgeTxt(l) : 'Read'}</span></div>` : '';
  const art = l.ill ? `<div class="ico ill">${illIMG(l.ill, true)}</div>` : `<div class="ico">${l.icona||'📖'}</div>`;
  const t = $(`<button class="tile wide" type="button">${art}
    <div class="txt"><div class="t"><span></span> <span class="tit"></span></div><div class="d"></div></div>${badge}</button>`);
  t.querySelector('.t span').textContent = l.titolo;
  t.querySelector('.tit').textContent = l.titoloIt || '';
  t.querySelector('.d').textContent = `${l.luogo ? l.luogo + ' · ' : ''}${l.frasi.length} sentences · ${plur(l.domande.length,'question','questions')}`;
  t.onclick = onClick || (()=>navigateTo(()=>runLettura(l)));
  return t;
}
function runLetture(){
  const stage = header('Readings');
  const all = DB.letture || [];
  stage.appendChild($(`<p class="sg-intro">Texts about Italy's cities, landscapes and society. <b>Tap any word</b> for its translation and grammar, listen sentence by sentence, then answer the questions.</p>`));
  if(!all.length){ stage.appendChild($(`<div class="empty"><div class="big">📖</div>No readings yet.</div>`)); return; }
  LT_LIVELLI.forEach(([lv, lab])=>{
    const items = all.filter(l=>(l.livello||1)===lv);
    if(!items.length) return;
    stage.appendChild($(`<div class="sec-h">${lab}</div>`));
    const list = $(`<div class="list"></div>`);
    items.forEach(l=>list.appendChild(letturaTile(l)));
    stage.appendChild(list);
  });
}

// reading (or listening: opts.ascolto hides the text until you ask for it)
function runLettura(l, opts){
  opts = opts || {};
  const ascolto = !!opts.ascolto;
  const stage = header(ascolto ? `Listening · ${l.titolo}` : l.titolo, {narrow:true});
  const gl = glossarioDi(l);
  const titIt = l.titoloIt || l.titolo;
  if(l.ill){
    const h = $(`<div class="atl-hero"><div class="atl-art">${illIMG(l.ill)}</div><div class="atl-cap"><h2 role="button" tabindex="0"><span></span>${ic('vol')}</h2><div class="dove"></div></div></div>`);
    h.querySelector('h2 span').textContent = titIt;
    h.querySelector('h2').onclick = ()=>{ stopPlay(); speak(titIt); };
    h.querySelector('.dove').innerHTML = `${ic('pin')} <span></span>`;
    h.querySelector('.dove span').textContent = `${l.luogo ? l.luogo + ' · ' : ''}${ascolto ? 'listen first, then read' : 'tap the words to translate them'}`;
    stage.appendChild(h);
  } else {
    const hero = $(`<div class="dlg-hero"><div class="e">${l.icona||'📖'}</div>
      <div class="tx"><button class="it" type="button" title="Listen"><span></span>${ic('vol')}</button><p></p></div></div>`);
    hero.querySelector('.it span').textContent = titIt;
    hero.querySelector('p').textContent = ascolto ? 'Listen first, then read' : 'Tap the words to translate them';
    hero.querySelector('.it').onclick = ()=>{ stopPlay(); speak(titIt); };
    stage.appendChild(hero);
  }

  const bar = $(`<div class="dlg-bar"></div>`);
  const playBtn = $(`<button class="btn blue sm" type="button"></button>`);
  const slowBtn = $(`<button class="btn soft sm" type="button">🐢 Slowly</button>`);
  const trBtn = $(`<button class="btn soft sm" type="button"></button>`);
  bar.append(playBtn, slowBtn, trBtn);
  stage.appendChild(bar);

  const testo = $(`<div class="lt-text${ascolto ? ' lt-hidden' : ''}"></div>`);
  const righe = l.frasi.map((f,k)=>{
    const r = $(`<div class="lt-s"><button class="lt-play" type="button" aria-label="Listen to the sentence">${ic('vol')}</button><div class="lt-body"><div class="lt-it" lang="it"></div><div class="lt-en"></div></div></div>`);
    const lente = lensBtn(f.it, f.en, {glossario:gl, tema:`Reading: ${l.titolo}`});
    lente.classList.add('lt-lens');
    r.appendChild(lente);
    testoCliccabile(r.querySelector('.lt-it'), f.it, (el, w, prev)=>popParola(el, w, {glossario:gl, prev, tag:['letture']}), w=>gl.has(normApo(w).toLowerCase()));
    r.querySelector('.lt-en').textContent = f.en;
    r.querySelector('.lt-play').onclick = ()=>{ stopPlay(); mark(k); speakAs(f.it, 'A', ()=>mark(-1)); };
    testo.appendChild(r);
    return r;
  });
  stage.appendChild(testo);

  let showEn = !!settings().ltEn;
  function paintTr(){
    if(ascolto && testo.classList.contains('lt-hidden')){ trBtn.innerHTML = `${ic('eye')} Show the text`; return; }
    testo.classList.toggle('show-en', showEn);
    trBtn.innerHTML = `${ic('eye')} ${showEn ? 'Hide English' : 'Show English'}`;
  }
  trBtn.onclick = ()=>{
    if(ascolto && testo.classList.contains('lt-hidden')){ testo.classList.remove('lt-hidden'); paintTr(); return; }
    showEn = !showEn; setSetting('ltEn', showEn); paintTr();
  };
  paintTr();

  let tok = 0, playing = false;
  function mark(k){ righe.forEach((r,i)=>r.classList.toggle('playing', i===k)); }
  function paintPlay(){ playBtn.innerHTML = playing ? `${ic('stop')} Stop` : `${ic('play')} Play all`; }
  function stopPlay(){ tok++; playing = false; mark(-1); paintPlay(); }
  function playAll(rate){
    const my = ++tok; playing = true; paintPlay();
    let k = 0;
    const step = ()=>{
      if(my!==tok) return;
      if(k>=l.frasi.length){ stopPlay(); if(ascolto) updExtra(s=>{ s.ascolti = s.ascolti || {}; s.ascolti[l.id] = (s.ascolti[l.id]||0) + 1; }); return; }
      mark(k); righe[k].scrollIntoView({block:'nearest', behavior:'smooth'});
      speakAs(l.frasi[k].it, 'A', ()=>{ if(my!==tok) return; k++; setTimeout(step, 450); }, rate);
    };
    step();
  }
  playBtn.onclick = ()=>{ if(playing){ stopPlay(); stopSpeech(); } else playAll(); };
  slowBtn.onclick = ()=>{ stopPlay(); stopSpeech(); playAll(0.72); };
  paintPlay();
  onLeave(()=>{ tok++; stopSpeech(); });
  if(ascolto) setTimeout(()=>{ if(!playing) playAll(); }, 500);

  // full glossary, closed
  const voci = Object.entries(l.glossario||{});
  if(voci.length){
    const det = $(`<details class="pcard lt-gloss"><summary>${ic('book')} Glossary <span class="pill">${voci.length}</span></summary><div class="kw-list"></div></details>`);
    voci.forEach(([it, en])=>det.querySelector('.kw-list').appendChild(kwRow(it, en, {glossario:gl, tag:['letture']})));
    stage.appendChild(det);
  }
  if(l.nota) stage.appendChild($(`<div class="nota-box">${ic('bulb')}<div>${esc(l.nota)}</div></div>`));
  const q = $(`<button class="btn primary block" type="button">${ic('quiz')} Comprehension questions (${l.domande.length})</button>`);
  q.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runLetturaQuiz(l)); };
  stage.appendChild(q);
  const luogo = l.luogoId && (DB.luoghi||[]).find(x=>x.id===l.luogoId);
  if(luogo){
    const a = $(`<button class="textbtn" type="button" style="align-self:center">${ic('landmark')} In the atlas: ${esc(luogo.nome)}</button>`);
    a.onclick = ()=>{ stopPlay(); navigateTo(()=>runLuogo(luogo)); };
    stage.appendChild(a);
  }
}
function runLetturaQuiz(l){
  const qs = l.domande.map(d=>({q:d.q, sub:d.en, correct:d.ok, opts:shuffle([d.ok, ...d.opts]), speak:d.q, frase:{it:d.q, en:d.en},
                                err:{it:`${d.q} — ${d.ok}`, en:d.en, fonte:'Readings'}}));
  runMCQ(shuffle(qs), `Questions · ${l.titolo}`, ()=>runLetturaQuiz(l), {
    onAnswer:(Q, ok)=>recordActivity(ok),
    onEnd:(giuste, tot)=>{
      if(giuste/tot >= .6){
        const prima = !!letteStato()[l.id];
        updExtra(s=>{ s.letture = s.letture || {}; s.letture[l.id] = true; });
        if(!prima) addXP(40);
      }
    }
  });
}

function proverbioDelGiorno(){ const p = DB.proverbi || []; return p.length ? p[giornoN() % p.length] : null; }
function cardProverbio(p){ return {kick:'Proverbio italiano', big:p.it, sub:p.lett, en:p.en ? '≈ '+p.en : '', bigSize:96, file:'proverbio.jpg'}; }
function runCultura(){
  const stage = header('Reading & culture');
  const scena = $(`<div class="scene">
      <img class="scene-img" src="img/luoghi/piazza.webp" alt="Piazza Navona in Rome: the church of Sant'Agnese, the obelisk and Bernini's fountain" decoding="async">

  const L = DB.letture || [];

    stage.appendChild($(`<div class="sec-h">Readings · ${Object.keys(lette).filter(k=>L.some(l=>l.id===k)).length} / ${L.length} read</div>`));

      rl.appendChild(all);
    }
    stage.appendChild(rl);
  }
  const p = proverbioDelGiorno();
  if(p){

    tutti.onclick = ()=>navigateTo(runProverbi);
    c.querySelector('.row').append(shareBtn(cardProverbio(p)), tutti);

    stage.appendChild(c);
  }
  stage.appendChild($(`<div class="sec-h">Language traps and treasures</div>`));
  const list = $(`<div class="list"></div>`);
  const nIdiomi = (DB.modididire||[]).reduce((n,c)=>n+(c.espressioni||[]).length,0);
  [
    ['🪤','False friends', `${(DB.falsiAmici||[]).length} words that look English but aren't`, runParoleTrappola],
    ['❓','Quiz: friend or foe?','What does this word really mean?', runQuizTrappola],

function runQuizProverbi(){
  const con = (DB.proverbi||[]).filter(p=>p.en);
  const qs = sample(con, Math.min(8, con.length)).map(p=>{
    const altri = sample([...new Set(con.filter(x=>x.en!==p.en).map(x=>x.en))], 3);
    return {q:p.it, sub:'Which English saying is closest?', correct:p.en, opts:shuffle([p.en, ...altri]), speak:p.it,
            after:`Literally: ${esc(p.lett)}${p.sig ? '<br>' + esc(p.sig) : ''}`, err:{it:p.it, en:p.en, fonte:'Proverbs'}};
  });
  runMCQ(qs, 'Proverb quiz', runQuizProverbi, {onAnswer:(Q, ok)=>recordActivity(ok)});
}

// ---------- false friends ----------
function runParoleTrappola(){
  const stage = header('False friends');
  stage.appendChild($(`<p class="sg-intro">They look like English words, but they mean something else — the classic mistakes of English speakers, even at C1. Tap to listen.</p>`));
  const q = $(`<button class="btn primary block" type="button">${ic('quiz')} Test yourself</button>`);
  q.onclick = ()=>navigateTo(runQuizTrappola);
  stage.appendChild(q);
  const body = $(`<div class="list" style="gap:8px"></div>`);
  (DB.falsiAmici||[]).forEach(f=>{
    const r = $(`<div class="ff-item" role="button" tabindex="0"><div class="pv-top" style="width:100%"><b lang="it" style="flex:1"></b><div class="pv-acts"></div></div><div class="ff-no">${ic('x')} <span></span></div><div class="ff-si">${ic('check')} <span></span></div></div>`);
    r.querySelector('b').textContent = f.it;
    r.querySelector('.ff-no span').textContent = `not «${f.sembra}»`;
    r.querySelector('.ff-si span').textContent = f.en + (f.nota ? ` — ${f.nota}` : '');
    if(f.es){ const e = $(`<div class="ff-es"></div>`); e.textContent = `«${f.es}»`; r.appendChild(e); }
    r.querySelector('.pv-acts').append(lensBtn(f.es || f.it, f.en), saveMini(f.it, f.en, {tag:['falsi amici']}));
    r.onclick = ()=>speak(f.es || f.it);
    body.appendChild(r);
  });
  stage.appendChild(body);
}
function runQuizTrappola(){
  const falsi = DB.falsiAmici || [];
  const breve = s => String(s).replace(/\s*\(.*\)\s*$/, '');
  const qs = sample(falsi, Math.min(10, falsi.length)).map(f=>{
    const ok = breve(f.en);
    const altri = sample(falsi.map(x=>breve(x.en)).filter(t=>t!==ok && t!==f.sembra), 2);
    return {q:f.it, sub:'What does it really mean?', correct:ok, opts:shuffle([ok, f.sembra, ...altri]), speak:f.it,
            after:`False friend: it looks like «${esc(f.sembra)}», but it isn't!${f.es ? `<br><i>«${esc(f.es)}»</i>` : ''}`,
            frase: f.es ? {it:f.es, en:''} : false, err:{it:f.it, en:ok, fonte:'False friends'}};
  });
  runMCQ(qs, 'Friend or foe?', runQuizTrappola, {onAnswer:(Q, ok)=>recordActivity(ok)});
}

function runIdiomQuiz(pool, titolo){

  }));

  let filtro = '';
  const chips = $(`<div class="atl-cats"></div>`);
  const mk = (t, lab)=>{ const b = $(`<button class="ref-chip" type="button"></button>`); b.textContent = lab; b.onclick = ()=>{ filtro = t; paint(); }; return b; };
  if(temi.length > 1){ chips.appendChild(mk('', 'All')); temi.forEach(t=>chips.appendChild(mk(t, t))); stage.appendChild(chips); }

      row.append(spkMini(f.it), saveMini(f.it, f.en, {tema:'Sentence anatomy'}));

      row.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); spiega(f.it, f.en); } };

}

// ITALY ATLAS: monuments, landscapes and dishes, each with its own
// illustration, a short C1 text (every word tappable), key words and a
// curiosity. Two games: «Guess the place» and «Which region?».
// =====================================================================
const ATL_CAT = [
  ['monumento','🏛️','Monuments'],
  ['natura','🏔️','Landscapes'],
  ['cibo','🍝','Food'],
];
function luoghiVisti(){ return new Set(extraStore().luoghi || []); }
function luogoDelGiorno(){ const L = DB.luoghi || []; return L.length ? L[(giornoN()*5 + 2) % L.length] : null; }
function atlArt(l, piccola){ return `<div class="atl-art">${illIMG(l.ill, piccola)}</div>`; }
function atlCard(l, visti){
  const c = $(`<button class="atl-card${visti.has(l.id) ? ' vista' : ''}" type="button">${atlArt(l, true)}<div class="atl-tx"><b lang="it"></b><small>${ic('pin')}<span></span></small></div></button>`);
  c.querySelector('b').textContent = l.nome;
  c.querySelector('small span').textContent = l.dove;
  c.onclick = ()=>navigateTo(()=>runLuogo(l));
  return c;
}
function runAtlante(cat){
  const stage = header('Italy atlas');
  const L = DB.luoghi || [];
  if(!L.length){ emptyDone(stage, '🗺️', 'The atlas is empty', 'No places yet.'); return; }
  const visti = luoghiVisti();
  const nVisti = L.filter(l=>visti.has(l.id)).length;
  stage.appendChild($(`<p class="sg-intro">The Italy everyone should know: ${L.length} monuments, landscapes and dishes, each with a short text in Italian (tap any word), key vocabulary and a curiosity. You have visited <b>${nVisti}</b>.</p>`));
  const giochi = $(`<div class="row"></div>`);
  const g1 = $(`<button class="btn primary" type="button">${ic('compass')} Guess the place</button>`);
  g1.onclick = ()=>navigateTo(()=>runAtlasQuiz('luogo'));
  const g2 = $(`<button class="btn" type="button">${ic('pin')} Which region?</button>`);
  g2.onclick = ()=>navigateTo(()=>runAtlasQuiz('regione'));
  giochi.append(g1, g2);
  stage.appendChild(giochi);
  const sWrap = $(`<div class="search">${ic('search')}<input class="vocab-input" type="search" enterkeyhint="search" placeholder="Search a place, a dish or a region…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>`);
  const inp = sWrap.querySelector('input');
  stage.appendChild(sWrap);
  let filtro = cat || '', q = '', tm = null;
  inp.oninput = ()=>{ clearTimeout(tm); tm = setTimeout(()=>{ q = normSearch(inp.value.trim()); paint(); }, 120); };
  const trovato = l=>!q || [l.nome, l.dove, l.regione, l.citta].some(s=>s && normSearch(s).includes(q));
  const chips = $(`<div class="atl-cats"></div>`);
  const mk = (k, lab)=>{ const b = $(`<button class="ref-chip" type="button"></button>`); b.innerHTML = lab; b.dataset.k = k; b.onclick = ()=>{ filtro = k; paint(); }; return b; };
  chips.appendChild(mk('', `All <small>${L.length}</small>`));
  ATL_CAT.forEach(([k,e,t])=>{ const n = L.filter(l=>l.cat===k).length; if(n) chips.appendChild(mk(k, `${e} ${t} <small>${n}</small>`)); });
  stage.appendChild(chips);
  const body = $(`<div class="list" style="gap:12px"></div>`);
  stage.appendChild(body);
  function paint(){
    chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===filtro));
    body.innerHTML = '';
    let n = 0;
    ATL_CAT.filter(([k])=>!filtro || k===filtro).forEach(([k,e,t])=>{
      const items = L.filter(l=>l.cat===k && trovato(l));
      if(!items.length) return;
      n += items.length;
      body.appendChild($(`<div class="sec-h">${e} ${t}</div>`));
      const g = $(`<div class="atl-grid"></div>`);
      items.forEach(l=>g.appendChild(atlCard(l, visti)));
      body.appendChild(g);
    });
    if(!n) body.appendChild($(`<div class="empty"><div class="big">🔎</div>Nothing found: try a city or a region, e.g. «Sicilia».</div>`));
  }
  paint();
}
function runLuogo(l){
  const L = DB.luoghi || [];
  const stesso = L.filter(x=>x.cat===l.cat);
  const k = stesso.indexOf(l);
  const stage = header(l.nome, {narrow:true});

  const hero = $(`<div class="atl-hero">${atlArt(l)}<div class="atl-cap"><h2 role="button" tabindex="0" lang="it"><span></span>${ic('vol')}</h2><div class="dove">${ic('pin')}<span></span></div></div></div>`);

  if(l.testo){
    const p = $(`<div class="pcard pill-testo"><p lang="it"></p><div class="en"></div></div>`);

    p.querySelector('.en').textContent = l.en || '';
    stage.appendChild(p);
    const bar = $(`<div class="dlg-bar" style="justify-content:center"></div>`);
    const ascolta = $(`<button class="btn blue sm" type="button">${ic('play')} Listen</button>`);
    let parla = false;
    const reset = ()=>{ parla = false; ascolta.innerHTML = `${ic('play')} Listen`; };
    ascolta.onclick = ()=>{ if(parla){ stopSpeech(); reset(); return; } parla = true; ascolta.innerHTML = `${ic('stop')} Stop`; speakAs(l.testo, 'A', reset); };
    bar.appendChild(ascolta);
    if(l.en){ const tr = $(`<button class="btn soft sm" type="button">${ic('eye')} English</button>`); tr.onclick = ()=>p.classList.toggle('show-en'); bar.appendChild(tr); }
    bar.appendChild(lensBtn(l.testo.split(/(?<=[.!?])\s+/)[0], ''));
    stage.appendChild(bar);
  }
  if(l.curiosita) stage.appendChild($(`<div class="curio">${ic('bulb')}<div><b>Did you know?</b> ${esc(l.curiosita)}</div></div>`));
  if(l.parole && l.parole.length){
    const kw = $(`<div class="pcard"><h3>${ic('key')} Key words</h3><div class="kw-list"></div></div>`);
    l.parole.forEach(w=>kw.querySelector('.kw-list').appendChild(kwRow(w.it, w.en, {tag:[l.cat==='cibo' ? 'gastronomia' : 'paesaggio'], tema:l.nome})));
    stage.appendChild(kw);
  }
  const lt = (DB.letture||[]).find(x=>x.luogoId===l.id);
  if(lt){
    const b = rowTile(ic('bookopen'), `Read: ${esc(lt.titolo)}`, `${esc(lt.titoloIt||'')} · ${lt.frasi.length} sentences`, ()=>navigateTo(()=>runLettura(lt)));
    stage.appendChild(b);
  }
  passoManuale(stage, 'luogo', l.id);

function runAtlasQuiz(tipo){

const ARTICOLI_NOMI = _ART.map(([it, en, g, pl, perche, defOv, defPlOv])=>{
  const gg = g==='mf' ? 'm' : g;
  return {it, en, g, pl, enPl: en + ' (plural)', perche,
    def: defOv || articolo(it, gg), ind: articoloInd(it, gg), defPl: defPlOv || articolo(pl, gg==='m' && /a$/.test(pl) && /o$/.test(it) ? 'f' : gg, true)};
});
function regolaArticolo(parola, g, pl){
  const w = String(parola||'').toLowerCase();
  if(g==='f') return pl ? 'Feminine plural: always «le» (le amiche, le zie).' : VOCALI.test(w) ? 'Feminine before a vowel: «l\'» — and «un\'», with the apostrophe.' : 'Feminine: «la» / «una», even before s + consonant or z (la scuola, la zona).';
  if(pl) return (VOCALI.test(w) || LO_START.test(w)) ? 'Masculine plural before a vowel, s + consonant, z, gn, ps, pn, x, y: «gli».' : 'Masculine plural before a normal consonant: «i».';
  if(VOCALI.test(w) && !/^i[aeiou]/.test(w)) return 'Masculine before a vowel: «l\'» — but «un», without an apostrophe.';
  return LO_START.test(w) ? 'Masculine before s + consonant, z, gn, ps, pn, x, y (and semivowel i): «lo» / «uno».' : 'Masculine before a normal consonant: «il» / «un».';
}
function runArticoli(){
  const qs = sample(ARTICOLI_NOMI, 15).map((n, k)=>{
    const tipo = k % 3;                            // 0 definite, 1 plural, 2 indefinite
    const g = n.g==='mf' ? 'm' : n.g;
    if(tipo===1 && n.pl){
      const ok = `${n.defPl} ${n.pl}`;
      const w = n.it, regolare = /o$/.test(w) ? w.slice(0,-1)+'i' : /a$/.test(w) ? w.slice(0,-1)+(g==='f' ? 'e' : 'i') : /e$/.test(w) ? w.slice(0,-1)+'i' : w;
      const falsi = [`i ${n.pl}`, `gli ${n.pl}`, `le ${n.pl}`, `${n.defPl} ${regolare}`, `${articolo(regolare, g, true)} ${regolare}`, `${n.defPl==='le' ? 'gli' : 'le'} ${regolare}`];
      const opts = [...new Set(falsi)].filter(x=>x!==ok);
      return {q:`${conArticolo(n.it, g)} → ?`, sub:`${n.en} · the plural, with its article`, correct:ok, opts:shuffle([ok, ...sample(opts, 3)]),
              speak:ok, speakAfter:true, after:esc(n.perche), frase:false, err:{it:`${conArticolo(n.it, g)} → ${ok}`, en:n.en, fonte:'Articles'}};
    }
    if(tipo===2){
      const ok = n.ind, forma = ok.endsWith("'") ? ok + n.it : `${ok} ${n.it}`;
      return {q:`___ ${n.it}`, sub:`${n.en} · indefinite article`, correct:ok, opts:['un','uno','una',"un'"], speak:forma, speakAfter:true,
              done:esc(forma), after:esc(regolaArticolo(n.it, g, false)), frase:false, err:{it:forma, en:n.en, fonte:'Articles'}};
    }
    const ok = n.def, forma = ok.endsWith("'") ? ok + n.it : `${ok} ${n.it}`;
    return {q:`___ ${n.it}`, sub:`${n.en} · definite article`, correct:ok, opts:['il','lo','la',"l'"], speak:forma, speakAfter:true,
            done:esc(forma), after:esc(n.perche || regolaArticolo(n.it, g, false)), frase:false, err:{it:forma, en:n.en, fonte:'Articles'}};
  });
  runMCQ(qs, 'Articles and plurals', runArticoli, {onAnswer:(Q, ok)=>recordActivity(ok)});
}

// Memory: match the Italian word with its English translation, against the clock
const MEM_BEST_KEY = "italiano_memory_best_v1";
function memBest(){ try{ return JSON.parse(localStorage.getItem(MEM_BEST_KEY)||"{}") || {}; }catch(e){ return {}; } }
function fmtTime(s){ const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
const MEM_LEVELS = [[6,"Easy","6 pairs · 12 cards","🌱"],[8,"Medium","8 pairs · 16 cards","🌿"],[10,"Hard","10 pairs · 20 cards","🌳"]];
function runMemory(){
  const stage = header('Memory');
  stage.appendChild($(`<p class="sg-intro">Turn the cards over and match each Italian word with its translation. Every pair found counts as a review.</p>`));
  const best = memBest();
  const list = $(`<div class="list"></div>`);
  MEM_LEVELS.forEach(([n,label,desc,ico])=>{
    const rec = best[n] ? `<span class="right pill gold">${ic('trophy')} ${fmtTime(best[n])}</span>` : '';
    list.appendChild(rowTile(ico, label, desc, ()=>navigateTo(()=>playMemory(n)), rec));
  });
  stage.appendChild(list);
}
function playMemory(pairs){
  // short words: long translations can't be read on small cards
  let pool = (DB.voci||[]).filter(w=>w.it && w.en && w.en.length<=20 && w.it.length<=13 && !/\s/.test(w.it));
  const c1 = pool.filter(w=>w.livello==='C1');
  if(c1.length >= pairs*3) pool = Math.random()<.5 ? c1 : pool;
  const label = (MEM_LEVELS.find(l=>l[0]===pairs)||[])[1] || '';
  if(pool.length < pairs){ const stage = header('Memory'); emptyDone(stage, '🧠', 'Not enough words', 'There aren\'t enough words to play.'); return; }
  // no two words with the same translation: it would make the match ambiguous
  const scelte = [], visti = new Set();
  for(const w of shuffle(pool)){
    const k = w.en.toLowerCase(), r = w.it.toLowerCase();
    if(visti.has(k) || visti.has(r)) continue;
    visti.add(k); visti.add(r); scelte.push(w);
    if(scelte.length===pairs) break;
  }
  let cards = [];
  scelte.forEach(w=>{ cards.push({key:w.id, lang:"IT", text:w.it, say:w.it}); cards.push({key:w.id, lang:"EN", text:w.en}); });
  cards = shuffle(cards);
  const stage = header(`Memory · ${label}`, {narrow:true});
  const statsEl = $(`<div class="mem-stats"><span>${ic('clock')} <b class="memTime">0:00</b></span><span>Moves <b class="memMoves">0</b></span><span>Found <b class="memFound">0</b>/${pairs}</span></div>`);
  statsEl.querySelectorAll('.i').forEach(i=>{ i.style.width='14px'; i.style.height='14px'; i.style.marginTop='-2px'; });
  stage.appendChild(statsEl);
  const grid = $(`<div class="mem-grid ${pairs<=6?'c3':'c4'}"></div>`);
  stage.appendChild(grid);
  let first=null, lock=false, moves=0, found=0, startTime=null, timer=null;
  const setStat = (cls,v)=>{ const e=statsEl.querySelector(cls); if(e) e.textContent=v; };
  const tick = ()=>setStat(".memTime", fmtTime(Math.round((Date.now()-startTime)/1000)));
  onLeave(()=>clearInterval(timer));
  cards.forEach(c=>{
    const el = $(`<button class="mem-card" type="button"><div class="mem-inner"><div class="mem-face mem-back"><span>?</span></div>
      <div class="mem-face mem-front" lang="${c.lang==='IT'?'it':'en'}"><span class="mem-lang">${c.lang}</span></div></div></button>`);
    const front = el.querySelector('.mem-front');
    front.appendChild(document.createTextNode(c.text));
    if(c.text.length > (pairs<=6 ? 11 : 8)) front.classList.add('long');
    el.onclick = ()=>flip(c, el);
    grid.appendChild(el);
  });
  function flip(c, el){
    if(lock || el.classList.contains("up") || el.classList.contains("done")) return;
    if(!startTime){ startTime=Date.now(); timer=setInterval(tick, 500); }
    el.classList.add("up");
    if(c.say) speak(c.say);
    if(!first){ first={c, el}; return; }
    moves++; setStat(".memMoves", moves);
    const a = first; first = null;
    if(a.c.key===c.key){
      haptic(true);
      a.el.classList.add("done"); el.classList.add("done");
      grade(c.key, true);
      found++; setStat(".memFound", found);
      if(found===pairs) win();
    } else {
      haptic(false);
      lock = true;
      a.el.classList.add("miss"); el.classList.add("miss");
      setTimeout(()=>{ a.el.classList.remove("up","miss"); el.classList.remove("up","miss"); lock = false; }, 750);
    }
  }
  function win(){
    if(timer) clearInterval(timer);
    const secs = startTime ? Math.round((Date.now()-startTime)/1000) : 0;
    const best = memBest(), prev = best[pairs];
    const isBest = !prev || secs < prev;
    if(isBest){ best[pairs]=secs; try{ localStorage.setItem(MEM_BEST_KEY, JSON.stringify(best)); }catch(e){} addXP(20); }
    setTimeout(()=>{
      finish(stage, `${fmtTime(secs)}`, ()=>playMemory(pairs), {
        titolo: isBest ? `New record: ${fmtTime(secs)}! 🧠` : `Done in ${fmtTime(secs)}`,
        testo: `${moves} moves for ${pairs} pairs.${prev && !isBest ? ` Record: ${fmtTime(prev)}.` : ''}`
      });
      if(isBest) confetti(stage.querySelector('.done'));
      stage.appendChild(listaParole('The words of the game', scelte));
    }, 600);
  }
}

// Speed challenge: 60 seconds, as many words as you can
function runLampo(){
  const stage = header('Speed challenge', {narrow:true});
  const rec = extraStore().lampo || 0;
  const pool = (DB.voci||[]).filter(v=>v.it && v.en && !/\s/.test(v.it.trim()) && v.en.length<=26);
  stage.appendChild($(`<div class="done lampo-start"><div class="big">⚡</div><h2>60 seconds</h2>
    <p class="muted" style="margin:0">Read the Italian word and tap the right translation, as fast as you can.<br>${rec ? `Your record: <b>${rec}</b> words.` : 'No record yet: set one!'}</p></div>`));
  const via = $(`<button class="btn primary block" type="button">${ic('play')} Via!</button>`);
  stage.appendChild(via);
  via.onclick = ()=>gioca();
  function gioca(){
    stage.innerHTML = '';
    const top = $(`<div class="lampo-top"><div class="lampo-time"><i></i></div><div class="lampo-score"><b>0</b> words</div></div>`);
    const wrap = $(`<div class="list" style="gap:12px"></div>`);
    stage.append(top, wrap);
    const fill = top.querySelector('.lampo-time i'), scoreEl = top.querySelector('.lampo-score b');
    const DURATA = 60000, t0 = Date.now();
    let punti = 0, sbagli = 0, fine = false, timer = null, onKey = null;
    const usate = new Set(), viste = [];
    const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
    const tick = ()=>{
      const rest = Math.max(0, DURATA - (Date.now()-t0));
      fill.style.width = (rest/DURATA*100) + '%';
      fill.classList.toggle('poco', rest < 10000);
      if(rest<=0) return termina();
      timer = requestAnimationFrame(tick);
    };
    onLeave(()=>{ fine = true; cancelAnimationFrame(timer); stopKeys(); });
    function domanda(){
      if(fine) return;
      let v, g = 0;
      do { v = pool[Math.floor(Math.random()*pool.length)]; } while(usate.has(v.id) && g++<30);
      usate.add(v.id);
      const altri = [];
      for(let t=0; altri.length<3 && t<200; t++){ const x = pool[Math.floor(Math.random()*pool.length)]; if(x.en!==v.en && !altri.includes(x.en) && (x.pos===v.pos || t>40)) altri.push(x.en); }
      const opts = shuffle([v.en, ...altri]);
      wrap.innerHTML = '';
      const card = $(`<div class="qcard lampo-q"><div class="q" lang="it"></div></div>`);
      card.querySelector('.q').textContent = parolaConArticolo(v);
      card.querySelector('.q').style.fontSize = fitSize(parolaConArticolo(v), 38, 24) + 'px';
      const box = $(`<div class="options lampo-opts"></div>`);
      let risposto = false;
      opts.forEach((o,k)=>{
        const b = $(`<button class="opt" type="button"><span class="kn">${k+1}</span></button>`);
        b.dataset.v = o;
        b.appendChild(document.createTextNode(o));
        b.onclick = ()=>{
          if(risposto || fine) return;
          risposto = true;
          const ok = o===v.en;
          b.classList.add(ok ? 'correct' : 'wrong');
          viste.push(Object.assign({sbagliata:!ok}, v));
          haptic(ok); recordActivity(ok);
          if(ok){ punti++; scoreEl.textContent = punti; setTimeout(domanda, 160); }
          else {
            sbagli++; logErrore(v.it, v.en, 'Speed challenge');
            const g2 = [...box.children].find(c=>c.dataset.v===v.en); if(g2) g2.classList.add('correct');
            setTimeout(domanda, 650);
          }
        };
        box.appendChild(b);
      });
      wrap.append(card, box);
    }
    onKey = e=>{ const k = parseInt(e.key,10); const box = wrap.querySelector('.options'); if(box && k>=1 && k<=4) box.children[k-1].click(); };
    document.addEventListener('keydown', onKey);
    function termina(){
      if(fine) return;
      fine = true; stopKeys();
      const prima = extraStore().lampo || 0;
      const record = punti > prima;
      if(record){ updExtra(s=>{ s.lampo = punti; }); addXP(20); }
      finish(stage, `${punti} words`, runLampo, {
        titolo: record ? `New record: ${punti}! ⚡` : `${plur(punti,'word','words')} in 60 seconds`,
        testo: `${sbagli ? `${plur(sbagli,'mistake','mistakes')}, added to your mistakes to review. ` : 'No mistakes! '}${record ? '' : `Record: ${prima}.`}`
      });
      if(record) confetti(stage.querySelector('.done'));
      if(punti) stage.appendChild(shareBtn({kick:'Speed challenge', big:`${punti} parole`, sub:'in 60 secondi', en:'Can you beat me?', bigSize:170, file:'sfida-lampo.jpg'}, 'Share the result'));
      if(viste.length) stage.appendChild(listaParole('The words of the challenge', viste.slice().sort((a,b)=>b.sbagliata-a.sbagliata)));
    }
    domanda();
    timer = requestAnimationFrame(tick);
  }
}

// =====================================================================
// THE GRAND TOUR: twelve stages from Turin to Palermo. Each city brings a
// grammar theme and a handful of steps (words, a reading, a dialogue, the
// gym, the atlas…) that send you to the app's exercises. Finish a city and
// the next one opens; the Vespa on the map shows how far you have ridden.
// =====================================================================
let _passoAttivo = null;       // {tappa, i, soglia, depth}: the step in progress
function percorsoStato(){ return extraStore().percorso || {}; }
function passiFatti(t){ return new Set(percorsoStato()[t.id] || []); }
function tappaCompleta(t){ const f = passiFatti(t); return t.passi.every((p,i)=>f.has(i)); }
function tappaSbloccata(k){ const P = DB.percorso || []; return k===0 || (P[k-1] && tappaCompleta(P[k-1])); }
function tappaCorrente(){ const P = DB.percorso || []; const k = P.findIndex(t=>!tappaCompleta(t)); return k<0 ? P.length : k; }
function segnaPasso(t, i){
  let nuovo = false;
  updExtra(s=>{ s.percorso = s.percorso || {}; const a = s.percorso[t.id] || []; if(!a.includes(i)){ a.push(i); nuovo = true; } s.percorso[t.id] = a; });
  return nuovo;
}
const PASSO_TIPI = {
  flash:['🃏','Flashcards'], frasi:['🎧','Listen & complete'], componi:['🧩','Compose'], recita:['🎭','Dialogue'],
  dlgquiz:['💡','What do you answer?'], lettura:['📖','Reading'], ascolto:['👂','Listening'], gym:['🏋️','Grammar gym'],
  conj:['✏️','Conjugation'], luogo:['📍','Atlas'], atlasquiz:['🧭','Atlas quiz'], articoli:['📰','Articles'],
  proverbi:['📜','Proverbs'], trappola:['🪤','False friends'], idiomi:['🤌','Idioms'],
};
const PASSO_SENZA_SOGLIA = ['flash','recita','luogo'];
function lanciaPasso(p){
  const perTag = (arr, tags) => arr.filter(x=>(x.tag||[]).some(t=>(tags||[]).includes(t)));
  const trova = (arr, id) => (arr||[]).find(x=>x.id===id);
  switch(p.t){
    case 'flash': {
      let pool = perTag(DB.voci||[], p.tags);
      if(p.c1) pool = pool.filter(v=>v.livello==='C1').concat(pool.filter(v=>v.livello!=='C1'));
      return runFlash(pool, p.titolo, {ignoreDue:true, limit:p.n||12, restart:()=>lanciaPasso(p)});
    }
    case 'frasi': return runPhrase(0, {pool:sample(perTag(DB.frasi||[], p.tags), 8), titolo:p.titolo});
    case 'componi': return runComponi(null, {pool:perTag(DB.frasi||[], p.tags).map(f=>({id:f.id, it:f.it, en:f.en})), titolo:p.titolo});
    case 'recita': { const d = trova(DB.dialoghi, p.id); return d ? runRecita(d, dlgMio(d)) : runPercorso(); }
    case 'dlgquiz': { const d = trova(DB.dialoghi, p.id); return d ? runDlgQuiz(d) : runPercorso(); }
    case 'lettura': { const l = trova(DB.letture, p.id); return l ? runLettura(l) : runPercorso(); }
    case 'ascolto': { const l = trova(DB.letture, p.id); return l ? runLettura(l, {ascolto:true}) : runPercorso(); }
    case 'gym': { const g = trova(DB.palestra, p.id); return g ? runGymQuiz(g) : runPercorso(); }
    case 'conj': {
      const verbi = (p.verbi||[]).map(verbById).filter(Boolean);
      return runConjugation(p.tempi || ['indic.pres'], verbi.length ? verbi : undefined);
    }
    case 'luogo': { const l = trova(DB.luoghi, p.id); return l ? runLuogo(l) : runPercorso(); }
    case 'atlasquiz': return runAtlasQuiz(p.modo || 'luogo');
    case 'articoli': return runArticoli();
    case 'proverbi': return runQuizProverbi();
    case 'trappola': return runQuizTrappola();
    case 'idiomi': return runIdiomQuiz((DB.modididire||[]).flatMap(c=>c.espressioni||[]));
  }
  return runPercorso();
}
function avviaPasso(t, i){
  const p = t.passi[i];
  const soglia = PASSO_SENZA_SOGLIA.includes(p.t) ? 0 : 60;
  navigateTo(()=>{
    _passoAttivo = {tappa:t, i, soglia, depth:_navStack.length};
    lanciaPasso(p);
  });
}
// Called by the end screen: if a Grand Tour step was running (even from a
// deeper screen, like the questions after a reading), it is marked as done.
function passoCompletato(pct){
  const pa = _passoAttivo;
  if(!pa || _navStack.length < pa.depth) return null;
  if(pct!==null && pct < pa.soglia) return {pa, fallito:true};
  const eraFinita = tappaCompleta(pa.tappa);
  const nuovo = segnaPasso(pa.tappa, pa.i);
  const finita = tappaCompleta(pa.tappa);
  if(nuovo){ addXP(30); if(finita && !eraFinita) addXP(100); }
  return {pa, nuovo, tappaFinita: finita && !eraFinita};
}
function passoBox(r){
  const p = r.pa.tappa.passi[r.pa.i];
  const indietro = ()=>history.go(-(_navStack.length - r.pa.depth + 1));
  if(r.fallito) return $(`<div class="pcard passo-box ko"><b>🛵 Grand Tour</b><p>To complete «${esc(p.titolo)}» you need at least ${r.pa.soglia}% right answers. Try again with «Again»!</p></div>`);
  const P = DB.percorso || [];
  const k = P.indexOf(r.pa.tappa);
  const b = $(`<div class="pcard passo-box ok"><b></b><p></p><button class="btn blue block" type="button">${ic('map')} Back to the Grand Tour</button></div>`);
  b.querySelector('b').textContent = r.tappaFinita ? `🎉 ${r.pa.tappa.citta}: stage complete!` : `✓ Step done: ${p.titolo}`;
  b.querySelector('p').textContent = r.tappaFinita
    ? (P[k+1] ? `Next stop, stage ${k+2}: ${P[k+1].citta}. +100 points` : 'You have ridden the whole Grand Tour, from Turin to Palermo. Complimenti!')
    : `${r.nuovo ? '+30 points · ' : ''}${passiFatti(r.pa.tappa).size} of ${r.pa.tappa.passi.length} steps done in ${r.pa.tappa.citta}.`;
  b.querySelector('button').onclick = indietro;
  return b;
}
// steps without an end screen (a place of the atlas): a «done» button
function passoManuale(stage, tipo, id){
  const pa = _passoAttivo;
  if(!pa || _navStack.length < pa.depth) return;
  const p = pa.tappa.passi[pa.i];
  if(!p || p.t!==tipo || p.id!==id) return;
  const b = $(`<button class="btn primary block" type="button">${ic('check')} Done: back to the Grand Tour</button>`);
  b.onclick = ()=>{ const r = passoCompletato(null); b.replaceWith(passoBox(r)); haptic(true); };
  stage.appendChild(b);
}

// ---------- the map ----------
const TOUR_LAB = {Torino:'b', Milano:'t', Verona:'t', Venezia:'r', Bologna:'r', Firenze:'l', Siena:'l', Roma:'l', Napoli:'l', Amalfi:'b', Matera:'r', Palermo:'l'};
function mappaTour(P, onTap){
  const cur = tappaCorrente();
  const segs = ITALIA.rotta.split('Q');                // "Mx y", then one curve per leg
  const fatta = segs.slice(0, Math.min(cur, P.length-1) + 1).join('Q');
  const byCitta = new Map(ITALIA.citta.map(([n,x,y])=>[n,[x,y]]));
  let tappe = '';
  P.forEach((t,k)=>{
    const xy = byCitta.get(t.citta);
    if(!xy) return;
    const [x,y] = xy, pos = TOUR_LAB[t.citta] || 'r';
    const [tx, ty, anc] = pos==='l' ? [-5.5, 2.6, 'end'] : pos==='t' ? [0, -6, 'middle'] : pos==='b' ? [0, 10.5, 'middle'] : [5.5, 2.6, 'start'];
    const cls = tappaCompleta(t) ? 'ok' : k===cur ? 'cur' : '';
    tappe += `<g class="tappa ${cls}" data-k="${k}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" role="button" tabindex="0" aria-label="${esc(t.citta)}"><circle r="${k===cur ? 4 : 3.2}"/><text x="${tx}" y="${ty}" text-anchor="${anc}">${esc(t.citta)}</text></g>`;
  });
  const me = byCitta.get((P[Math.min(cur, P.length-1)]||{}).citta) || [0,0];
  const onde = [[30,120],[48,185],[70,232],[182,228],[205,120],[160,70],[20,238]].map(([x,y])=>`<path class="onda" d="M${x} ${y}q3 -2.4 6 0t6 0t6 0"/>`).join('');
  const el = $(`<div class="tour-map">
    <svg viewBox="${ITALIA.vb}" role="img" aria-label="Map of Italy with the Grand Tour route">
      ${onde}
      <path class="terra" d="${ITALIA.main}"/><path class="terra" d="${ITALIA.sic}"/><path class="terra" d="${ITALIA.sar}"/>
      <path class="rotta" d="${ITALIA.rotta}"/>
      <path class="rotta-fatta" d="${fatta}"/>
      ${tappe}
      <g class="tour-vespa" transform="translate(${(me[0]-9).toFixed(1)} ${(me[1]-17).toFixed(1)})"><use href="#ill-vespa" width="18" height="12.5"/></g>
    </svg>
    <div class="tour-cap"><button class="scene-it" type="button">Il Grand Tour${ic('vol')}</button><span>From Turin to Palermo: the Vespa shows where you are</span></div>
  </div>`);
  el.querySelector('.scene-it').onclick = ()=>speak('Il Grand Tour d\'Italia');
  if(onTap) el.querySelectorAll('.tappa').forEach(g=>{
    const go = ()=>onTap(+g.dataset.k);
    g.addEventListener('click', go);
    g.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } });
  });
  return el;
}
function apriTappa(k){
  const P = DB.percorso || [];
  if(!tappaSbloccata(k)){ haptic(false); toast(`🔒 First complete stage ${k}: ${esc(P[k-1].citta)}`); return; }
  navigateTo(()=>runTappa(P[k]));
}
function runPercorso(){
  _passoAttivo = null;
  const stage = header('Grand Tour');
  const P = DB.percorso || [];
  if(!P.length){ emptyDone(stage, '🛵', 'No stages yet', 'The Grand Tour is being prepared.'); return; }
  const cur = tappaCorrente();
  const tot = P.reduce((n,t)=>n+t.passi.length, 0), fatti = P.reduce((n,t)=>n+passiFatti(t).size, 0);
  const wrap = $(`<div class="tour-wrap"><div class="list" style="gap:12px"></div><div class="path"></div></div>`);
  const left = wrap.firstChild, path = wrap.lastChild;
  left.appendChild(mappaTour(P, apriTappa));
  left.appendChild($(`<p class="sg-intro">${P.length} cities, one grammar theme each. Every stage mixes words, readings, dialogues and the grammar gym: finish a city and the road to the next one opens.</p>`));
  left.appendChild($(`<div class="pcard dlg-prog"><div><b>${fatti} / ${tot}</b> <span>steps completed</span></div><div class="pbar"><i style="width:${tot?fatti/tot*100:0}%;background:var(--grad-prog)"></i></div></div>`));
  P.forEach((t,k)=>{
    const f = passiFatti(t).size, n = t.passi.length;
    const stato = tappaCompleta(t) ? 'done' : tappaSbloccata(k) ? (k===cur ? 'cur' : 'open') : 'lock';
    const node = $(`<button class="pnode p-${stato}" type="button"><div class="pn-dot">${stato==='done' ? ic('check') : stato==='lock' ? ic('lock') : t.icona}</div>
      <div class="pn-txt"><div class="pn-body"><div class="pn-k">Stage ${k+1}${stato==='cur'?' · <b>now</b>':''}</div><div class="pn-t"></div><div class="pn-d"></div>
      <div class="pn-bar"><i style="width:${f/n*100}%"></i></div></div>${t.ill ? `<div class="pn-art">${illIMG(t.ill, true)}</div>` : ''}</div></button>`);
    node.querySelector('.pn-t').textContent = t.citta;
    node.querySelector('.pn-d').textContent = `${t.tema} · ${f}/${n}`;
    node.onclick = ()=>apriTappa(k);
    path.appendChild(node);
  });
  stage.appendChild(wrap);
  requestAnimationFrame(()=>{ const c = path.querySelector('.pnode.p-cur'); if(c && cur>2 && innerWidth<760) c.scrollIntoView({block:'center'}); });
}
function runTappa(t){
  _passoAttivo = null;
  const P = DB.percorso || [];
  const k = P.indexOf(t);
  const stage = header(`Stage ${k+1} · ${t.citta}`);
  const f = passiFatti(t);
  const hero = $(`<div class="atl-hero">${t.ill ? `<div class="atl-art">${illIMG(t.ill)}</div>` : ''}<div class="atl-cap"><h2 role="button" tabindex="0" lang="it"><span></span>${ic('vol')}</h2><div class="dove"></div><p class="muted" style="text-align:left;margin:4px 0 0"></p></div></div>`);
  hero.querySelector('h2 span').textContent = t.citta;
  hero.querySelector('h2').onclick = ()=>speak(t.frase || t.citta);
  hero.querySelector('.dove').innerHTML = `${ic('rules')} <span></span>`;
  hero.querySelector('.dove span').textContent = `Grammar: ${t.tema} · ${f.size} of ${t.passi.length} steps`;
  hero.querySelector('p').textContent = t.desc || '';
  stage.appendChild(hero);
  if(t.frase){
    const c = $(`<div class="prov-card sm"><div class="pv-top"><button class="pv-it" type="button" lang="it"></button><div class="pv-acts"></div></div><div class="pv-en"></div></div>`);
    c.querySelector('.pv-it').textContent = t.frase;
    c.querySelector('.pv-it').onclick = ()=>speak(t.frase);
    c.querySelector('.pv-en').textContent = t.fraseEn || '';
    c.querySelector('.pv-acts').append(lensBtn(t.frase, t.fraseEn), saveMini(t.frase, t.fraseEn, {tema:`Grand Tour: ${t.citta}`}));
    stage.appendChild(c);
  }
  const list = $(`<div class="list"></div>`);
  const prossimo = t.passi.findIndex((p,i)=>!f.has(i));
  t.passi.forEach((p,i)=>{
    const [e, tipo] = PASSO_TIPI[p.t] || ['•', ''];
    const done = f.has(i);
    const b = $(`<button class="tile wide passo${done?' p-fatto':''}${i===prossimo?' p-next':''}" type="button"><div class="ico">${done ? '✅' : e}</div>
      <div class="txt"><div class="t"></div><div class="d"></div></div></button>`);
    b.querySelector('.t').textContent = p.titolo;
    b.querySelector('.d').textContent = done ? `${tipo} · done ✓ (you can redo it)` : `${tipo}${PASSO_SENZA_SOGLIA.includes(p.t) ? '' : ' · 60% needed'}`;
    b.onclick = ()=>avviaPasso(t, i);
    list.appendChild(b);
  });
  stage.appendChild(list);
  if(tappaCompleta(t)){
    stage.appendChild($(`<div class="nota-box">🎉<div>Stage complete! ${P[k+1] ? `Next stop: <b>${esc(P[k+1].citta)}</b>.` : 'You have ridden the whole Grand Tour.'}</div></div>`));

// ---------- study snapshot ----------
// words: new, learning (box 1) or learnt (box 2+: survived at least 3 days)
function studyStats(){
  const voci = (DB && DB.voci) || [];
  let nuove = 0, corso = 0, note = 0;
  voci.forEach(v=>{
    const st = srs[v.id];
    if(!st || !st.seen) nuove++;
    else if((st.box||0) >= 2) note++;
    else corso++;
  });
  let seen = 0, correct = 0;
  Object.values(srs).forEach(st=>{ seen += st.seen||0; correct += st.correct||0; });
  const log = activityLog();
  let giorniAttivi = 0, risposteTot = 0, giusteTot = 0;
  Object.values(log).forEach(d=>{ if(d.r){ giorniAttivi++; risposteTot += d.r||0; giusteTot += d.ok||0; } });
  const tot = Math.max(seen, risposteTot), ok = seen >= risposteTot ? correct : giusteTot;
  return {
    totale: voci.length, nuove, corso, note, seen: tot, correct: ok,
    precisione: tot ? Math.round(ok/tot*100) : 0,
    giorniAttivi, risposteTot, oggi: (log[todayStr()]||{r:0}).r
  };
}
// words seen at least 4 times and right less than 60% of the time
function paroleDifficili(){
  const voci = (DB && DB.voci) || [];
  return voci
    .map(v=>{ const st = srs[v.id]; return st && st.seen >= 4 ? {v, r: st.correct/st.seen, st} : null; })
    .filter(x=>x && x.r < 0.6)
    .sort((a,b)=>a.r - b.r || b.st.seen - a.st.seen)
    .map(x=>x.v);
}
// cards due in each of the next 7 days (today includes the backlog)
function previsioneRipassi(){
  const voci = (DB && DB.voci) || [];
  const out = [];
  for(let i=0; i<7; i++){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    const from = d.getTime(), to = from + DAY_MS;
    let n = 0;
    voci.forEach(v=>{
      const st = srs[v.id];
      if(!st || !st.due) return;
      if(i===0 ? st.due < to : (st.due >= from && st.due < to)) n++;
    });
    out.push({data:d, n});
  }
  return out;
}
function serieRecord(){
  const log = activityLog();
  const giorni = Object.keys(log).filter(k=>(log[k].r||0) > 0).sort();
  let best = 0, cur = 0, prev = null;
  giorni.forEach(g=>{
    if(prev){ const dp = new Date(prev+"T12:00:00"), dg = new Date(g+"T12:00:00"); cur = Math.round((dg - dp)/DAY_MS) === 1 ? cur+1 : 1; }
    else cur = 1;
    prev = g; if(cur > best) best = cur;
  });
  return best;
}
function statsSettimana(offset){
  const log = activityLog();
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const lun = new Date(oggi); lun.setDate(oggi.getDate() - ((oggi.getDay()+6)%7) - 7*offset);
  let r = 0, ok = 0, xp = 0, giorni = 0;
  for(let g=0; g<7; g++){
    const d = new Date(lun); d.setDate(lun.getDate()+g);
    if(d > oggi) break;
    const x = log[dateStr(d)];
    if(x && x.r){ giorni++; r += x.r; ok += x.ok||0; }
    if(x) xp += x.xp || (x.ok||0)*10 + Math.max(0,(x.r||0)-(x.ok||0))*2;
  }
  return {r, ok, xp, giorni};
}
function makeLivelloCard(){
  const xp = xpTotale(), lv = livelloDi(xp);
  const s = statsSettimana(0), p = statsSettimana(1);
  const delta = (a, b)=> b ? (a>=b ? `<span class="up">▲ ${a-b}</span>` : `<span class="down">▼ ${b-a}</span>`) : '';
  const next = LIVELLI_XP[lv.n];
  return $(`<div class="pcard lvl-card">

      <div class="muted" style="text-align:left;font-size:12.5px">${xp} points${lv.prossimo ? ` · ${lv.prossimo-xp} to go to «${next[1]}»` : ' · top level!'}</div></div></div>
    <div class="pbar" style="margin-top:10px"><i style="width:${Math.round(lv.frac*100)}%;background:var(--grad-prog)"></i></div>

  </div>`);
}
