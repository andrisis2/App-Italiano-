// ---------- daily reminder in the phone's calendar ----------
// Real notifications would need a server: a recurring calendar event does the same job.
function scaricaPromemoria(ora){
  const [hh, mm] = (ora || '19:00').split(':').map(n=>parseInt(n,10)||0);
  const d = new Date(); d.setHours(hh, mm, 0, 0);
  if(d < new Date()) d.setDate(d.getDate()+1);
  const p2 = n=>String(n).padStart(2,'0');
  const dt = x=>`${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${p2(now.getUTCMonth()+1)}${p2(now.getUTCDate())}T${p2(now.getUTCHours())}${p2(now.getUTCMinutes())}00Z`;
  const url = location.origin + location.pathname.replace(/index\.html$/, '');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Italiano//Reminder//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:reminder-italiano-'+Date.now()+'@italiano','DTSTAMP:'+stamp,'DTSTART:'+dt(d),'DURATION:PT10M','RRULE:FREQ=DAILY',
    'SUMMARY:🇮🇹 Italiano: 10 minuti','DESCRIPTION:Daily review. Open the app: '+url,'URL:'+url,
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Italiano: 10 minutes of review','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'italiano-reminder.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ---------- backup ----------
const BACKUP_PREFIXES = ["italiano_", "sofia_"];
const BACKUP_EXTRA    = ["flashDir", "scritturaModo"];
const BACKUP_ESCLUSI  = ["sofia_gemini_key"];     // the API key never ends up in a downloaded file
function chiaveInBackup(k){ return (BACKUP_PREFIXES.some(p=>k.startsWith(p)) || BACKUP_EXTRA.includes(k)) && !BACKUP_ESCLUSI.includes(k); }
function chiaviBackup(){
  const out = [];
  for(let i=0; i<localStorage.length; i++){ const k = localStorage.key(i); if(chiaveInBackup(k)) out.push(k); }
  return out;
}
function raccogliBackup(){
  const dati = {};
  chiaviBackup().forEach(k=>{ dati[k] = localStorage.getItem(k); });
  return {app:"italiano", formato:1, esportato:new Date().toISOString(), dati};
}

// ---------- theme ----------
const darkMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const t = settings().tema, r = document.documentElement;
  if(t === "light")     r.setAttribute("data-theme","light");
  else if(t === "dark") r.setAttribute("data-theme","dark");
  else                  r.removeAttribute("data-theme");
  syncThemeColor();
  if(typeof aggiornaCielo==='function' && document.body) aggiornaCielo();
}
function temaScuro(){
  const t = settings().tema;
  if(t === 'dark')  return true;
  if(t === 'light') return false;
  return !!(darkMq && darkMq.matches);
}
function syncThemeColor(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', temaScuro() ? '#0e1120' : '#f6f2ec');
}

// =====================================================================
// ANDREA, the AI tutor (Gemini, REST + JSON). You talk (the audio goes to
// Gemini, which transcribes it and comments on your pronunciation) or you
// type. Four modes: chat, corrections, role-play, debate. Every Italian
// word in Andrea's answers can be tapped; each answer has Repeat, Slower,
// Explain, English and Save. The API key stays on this device only.
// (The storage keys keep their historical "sofia_" names.)
// =====================================================================
const SOFIA_KEY  = "sofia_gemini_key";
const SOFIA_MEM  = "sofia_last_session";
const SOFIA_REST = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent";
const ROLEPLAY = [
  ['pa','🏛️','At the town hall',"Sei un impiegato dell'anagrafe di Bologna, gentile ma molto burocratico. Lo studente deve rinnovare la carta d'identità, ma gli manca un documento. Dai del Lei."],
  ['colloquio','💼','Job interview',"Sei la responsabile delle risorse umane di uno studio di design a Milano. Conduci un colloquio di lavoro formale (dai del Lei) e fai domande sull'esperienza, sui punti deboli e sulle aspettative."],
  ['cena','🍷','Dinner in Tuscany',"Sei un amico toscano che ha invitato lo studente a cena in un casale vicino a Montepulciano. Parli di vino, cibo, vendemmia e vita di campagna, in modo informale e affettuoso."],
  ['affitto','🏠','Renting a flat',"Sei il proprietario di un bilocale a Roma, a Trastevere. Lo studente vuole affittarlo: negoziate canone, spese condominiali, caparra e durata del contratto."],
  ['medico','🩺','At the doctor\'s',"Sei il medico di base. Lo studente descrive i sintomi; tu fai domande precise e dai consigli, con il lessico medico giusto."],
  ['reclamo','📞','Complaint call',"Sei un operatore del servizio clienti di una compagnia telefonica. Lo studente chiama per una bolletta sbagliata: sii cortese ma poco disponibile, finché non insiste con buoni argomenti."],
  ['sciopero','🚆','Train strike',"Sei un passeggero alla stazione di Santa Maria Novella a Firenze durante uno sciopero dei treni. Commentate la situazione, cercate insieme alternative e vi lamentate con ironia."],
];
function sofiaLoadMem(){ try{ return localStorage.getItem(SOFIA_MEM)||""; }catch(e){ return ""; } }
function sofiaSaveMem(history){
  if(!history || history.length < 2) return;
  const lines = history.slice(-8).map(h=>`${h.role==="user"?"Student":"Andrea"}: ${h.parts[0].text}`).join("\n");
  try{ localStorage.setItem(SOFIA_MEM, lines.slice(0, 600)); }catch(e){}
}
function sofiaPrompt(opts){
  const lang = opts.lang || 'it';
  const mie = esesStore().voci.slice(-30).map(v=>v.it).join(', ');
  const scena = ROLEPLAY.find(r=>r[0]===opts.scena) || ROLEPLAY[0];
  const modo = {
    free: "MODE: free conversation. Talk naturally about Italy, culture, current affairs, travel and the student's life and interests. Always end with one open question.",
    correction: "MODE: corrections. In \"correzione\" rewrite the student's last message correctly and explain every mistake in English, in at most two short lines (e.g. «Se avessi tempo, verrei — se + imperfect subjunctive, then conditional»). If there are no mistakes write «Perfetto! ✓». Then reply to the content.",
    roleplay: `MODE: role-play. ${scena[3]} Stay in character and keep the scene moving; start it yourself if the conversation is new.`,
    debate: "MODE: debate. Pick a C1 topic (overtourism in Venice, remote working, the brain drain, football and money, dialects in schools, fast food and the Mediterranean diet…), take a clear position and defend it with good connectives (tuttavia, benché, ciononostante, dal momento che). Challenge the student's arguments and ask them to justify theirs.",
  }[opts.mode || 'free'];
  const lingua = lang==="it+en"
    ? "Reply in Italian. When a word or structure might be hard, you may add a very short English clarification inside square brackets, [like this]."
    : "Reply ONLY in Italian (except the \"correzione\" explanation, which is in English).";
  return [
    "You are Andrea, a warm, witty Italian tutor from Florence.",
    "The student is a native English speaker at B2 level working towards C1. Speak naturally, at a native pace, using C1 structures when they fit: congiuntivo, periodo ipotetico, passato remoto in stories, relative pronouns (il quale, cui), idioms. Adapt if the student struggles.",
    lingua, modo,
    "If the student makes a serious mistake in any mode, also put a brief correction in \"correzione\".",
    mie ? `The student is learning these words: ${mie}. Use some of them naturally.` : "",
    opts.lastSession ? `Previous conversation (for continuity):\n${opts.lastSession}` : "",
    "Keep replies short: 2-4 sentences.",
    "Always answer ONLY with a JSON object with these fields:",
    '- "trascrizione": the exact words the student said in a voice message; empty string if the message is not audio.',
    '- "pronuncia": ONLY if the audio shows clear pronunciation problems (double consonants, stress, open/closed vowels, the r), one very short note in English; otherwise empty.',
    '- "correzione": see above; empty string when there is nothing to correct and you are not in correction mode.',
    '- "risposta": what you say as Andrea.',
    '- "traduzione": an English translation of "risposta".'
  ].filter(Boolean).join("\n");
}
// PCM float32 → 16-bit mono WAV, and ArrayBuffer → base64
function pcmToWav(chunks, rate){
  let len=0; for(const c of chunks) len+=c.length;
  const buf=new ArrayBuffer(44+len*2); const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF"); v.setUint32(4,36+len*2,true); ws(8,"WAVE"); ws(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,"data"); v.setUint32(40,len*2,true);
  let o=44;
  for(const c of chunks) for(let i=0;i<c.length;i++){ const s=Math.max(-1,Math.min(1,c[i])); v.setInt16(o,s*32767,true); o+=2; }
  return buf;
}
function bufToB64(buf){
  const u8=new Uint8Array(buf); let s="";
  for(let i=0;i<u8.length;i+=32768) s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  return btoa(s);
}
// without the English in [brackets]: that is what gets spoken
const soloItaliano = t => String(t||'').replace(/\s*\[[^\]]*\]/g, '').trim();

class AndreaSession {
  constructor({apiKey, opts, onMsg, onStatus}){
    this.apiKey = apiKey; this.opts = opts; this.onMsg = onMsg; this.onStatus = onStatus;
    this.active = false; this.history = [];
    this.audioCtx = null; this.micStream = null; this.recognition = null;
    this.audioMode = false; this.capturing = false; this._rec = null;
    this.textOnly = false; this._busy = false;
    this.userInputLang = "it-IT";
  }
  async connect(){
    this.active = true;
    this.onStatus("connecting");
    if(!this.textOnly){
      try{ await this._startMicVad(); this.audioMode = true; }
      catch(e){ this.audioMode = false; }        // no mic/worklet → browser speech recognition
    }
    if(!this.history.length && !this.textOnly){ this._chat({}); return; }
    this._resumeInput();
  }
  sendText(t){
    if(!this.active || this._busy) return;
    t = (t||"").trim(); if(!t) return;
    this.capturing = false;
    try{ this.recognition?.stop(); }catch(e){} this.recognition = null;
    stopSpeech();
    this._chat({text:t});
  }
  _resumeInput(){
    if(!this.active) return;
    this.onStatus("listening");
    if(this.textOnly) return;
    if(this.audioMode){ this._rec = {pre:[],preLen:0,buf:[],bufLen:0,speaking:false,silence:0,voiced:0,floor:0.004}; this.capturing = true; }
    else this._listen();
  }
  async _chat(input){
    if(!this.active || this._busy) return;
    this._busy = true;
    const o = typeof input==="string" ? {text:input} : (input||{});
    this.capturing = false;
    const GREET = {role:"user", parts:[{text:"(Start the conversation: greet the student in Italian according to the mode.)"}]};
    if(o.text){ this.history.push({role:"user", parts:[{text:o.text}]}); this.onMsg({role:"user", text:o.text, final:true}); }
    this.onStatus(o.audio ? "thinking" : "speaking");
    try{
      const contents = this.history.slice();
      if(o.audio) contents.push({role:"user", parts:[{inlineData:{mimeType:"audio/wav", data:o.audio}}, {text:"Voice message from the student: transcribe it, check the pronunciation and reply."}]});
      else if(!o.text && !contents.length) contents.push(GREET);
      const body = {
        system_instruction:{parts:[{text:sofiaPrompt(this.opts)}]},
        contents,
        generationConfig:{
          maxOutputTokens:700, temperature:0.85, responseMimeType:"application/json",
          responseSchema:{type:"OBJECT", properties:{trascrizione:{type:"STRING"}, pronuncia:{type:"STRING"}, correzione:{type:"STRING"}, risposta:{type:"STRING"}, traduzione:{type:"STRING"}}, required:["risposta"]}
        }
      };
      const resp = await fetch(`${SOFIA_REST}?key=${encodeURIComponent(this.apiKey)}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      if(!resp.ok){ const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
      const data = await resp.json();
      const raw = (data.candidates?.[0]?.content?.parts?.[0]?.text || "").trim();
      let out; try{ out = JSON.parse(raw); }catch(e){ out = {risposta:raw}; }
      const reply = (out.risposta||"").trim(), heard = (out.trascrizione||"").trim();
      if(o.audio){
        this.onMsg({role:"user", text:heard || "(unclear audio)", final:true});
        this.history.push({role:"user", parts:[{text:heard || "(unclear audio)"}]});
      } else if(!o.text && !this.history.length) this.history.push(GREET);
      if(reply){
        this.history.push({role:"model", parts:[{text:reply}]});
        this.onMsg({role:"andrea", text:reply, en:(out.traduzione||"").trim(), pron:(out.pronuncia||"").trim(), corr:(out.correzione||"").trim(), final:true});
        await this._speak(soloItaliano(reply));
      }
    }catch(e){
      if(o.audio && this.audioMode){
        this.audioMode = false;
        this.onMsg({role:"andrea", text:"⚠️ Direct audio isn't available: I'll carry on with the browser's speech recognition.", final:true, sistema:true});
      } else {
        this.onMsg({role:"andrea", text:`⚠️ Error: ${e.message}`, final:true, sistema:true});
        this.onStatus("error"); this._busy = false; return;
      }
    }
    this._busy = false;
    if(this.active) this._resumeInput();
  }
  _listen(){
    if(!this.active) return;
    if(!SpeechRec){ this.onMsg({role:"andrea", text:"⚠️ Speech recognition isn't supported here: write your message below (or try Chrome).", final:true, sistema:true}); this.textOnly = true; this.onStatus("listening"); return; }
    this.recognition = new SpeechRec();
    this.recognition.lang = this.userInputLang; this.recognition.continuous = false; this.recognition.interimResults = true;
    let finale = null;
    this.recognition.onresult = e=>{
      let t = "", fin = false;
      for(let i=e.resultIndex; i<e.results.length; i++){ t += e.results[i][0].transcript; if(e.results[i].isFinal) fin = true; }
      this.onMsg({role:"user", text:t, final:false});
      if(fin && t.trim()) finale = t.trim();
    };
    this.recognition.onerror = ()=>{};
    this.recognition.onend = ()=>{
      if(this.active && finale){ this._chat(finale); finale = null; }
      else if(this.active && !this._busy){ this.onStatus("listening"); this._listen(); }
    };
    try{ this.recognition.start(); }catch(e){}
  }
  _speak(text){
    return new Promise(resolve=>{
      if(!('speechSynthesis' in window) || !text) return resolve();
      speakAs(text, 'A', resolve);
    });
  }
  // microphone capture for direct audio: 16 kHz PCM from a worklet, with a
  // voice detector (starts when you speak, closes after ~1.3 s of silence)
  async _startMicVad(){
    this.audioCtx = new AudioContext({sampleRate:16000});
    if(this.audioCtx.state==="suspended") await this.audioCtx.resume();
    this.micStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
    const source = this.audioCtx.createMediaStreamSource(this.micStream);
    const code = `class P extends AudioWorkletProcessor{process(i){if(i[0]&&i[0][0])this.port.postMessage(i[0][0].slice());return true}}registerProcessor('pcm-andrea',P)`;
    const url = URL.createObjectURL(new Blob([code], {type:"application/javascript"}));
    await this.audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    const node = new AudioWorkletNode(this.audioCtx, "pcm-andrea");
    node.port.onmessage = ({data})=>this._onAudioChunk(data);
    source.connect(node);
  }
  _onAudioChunk(f32){
    if(!this.capturing || !this.active) return;
    const rec = this._rec; if(!rec) return;
    const rate = this.audioCtx ? this.audioCtx.sampleRate : 16000;
    let sum = 0; for(let i=0; i<f32.length; i++) sum += f32[i]*f32[i];
    const rms = Math.sqrt(sum/f32.length);
    if(!rec.speaking){
      rec.floor = Math.min(0.02, rec.floor*0.95 + rms*0.05);
      rec.pre.push(f32); rec.preLen += f32.length;
      while(rec.preLen > rate*0.4 && rec.pre.length > 1){ rec.preLen -= rec.pre[0].length; rec.pre.shift(); }
      if(rms > Math.max(0.012, rec.floor*3)){
        rec.voiced += f32.length;
        if(rec.voiced > rate*0.06){ rec.speaking = true; rec.buf = rec.pre.slice(); rec.bufLen = rec.preLen; rec.silence = 0; this.onStatus("recording"); }
      } else rec.voiced = 0;
    } else {
      rec.buf.push(f32); rec.bufLen += f32.length;
      if(rms < Math.max(0.007, rec.floor*2)){ rec.silence += f32.length; if(rec.silence > rate*1.3) return this._endUtterance(); }
      else rec.silence = 0;
      if(rec.bufLen > rate*20) this._endUtterance();          // at most 20 seconds a turn
    }
  }
  _endUtterance(){
    const rec = this._rec; if(!rec || !rec.speaking) return;
    this.capturing = false;
    const rate = this.audioCtx ? this.audioCtx.sampleRate : 16000;
    if(rec.bufLen < rate*0.45){ this._resumeInput(); return; }   // too short: noise
    const b64 = bufToB64(pcmToWav(rec.buf, rate));
    this._rec = null;
    this._chat({audio:b64});
  }
  disconnect(){
    this.active = false; this.capturing = false; this._rec = null;
    try{ this.recognition?.stop(); }catch(e){} this.recognition = null;
    this.micStream?.getTracks().forEach(t=>t.stop());
    try{ this.audioCtx?.close(); }catch(e){}
    stopSpeech();
    this.onStatus("disconnected");
  }
}

  const put = (k, v)=>{ try{ localStorage.setItem(k, v); }catch(e){} };
  const opts = {
    lang: get('sofia_lang', ['it','it+en'], 'it+en'),

    scena: get('sofia_scena', ROLEPLAY.map(r=>r[0]), ROLEPLAY[0][0]),

  const scene = $(`<div class="atl-cats"></div>`);
  ROLEPLAY.forEach(([k,e,t])=>{ const b = $(`<button class="ref-chip" type="button"></button>`); b.dataset.v = k; b.textContent = `${e} ${t}`; b.onclick = ()=>setScena(k); scene.appendChild(b); });
  controls.append(segLang, segMode, scene, segUser);
  stage.appendChild(controls);
  const paintSeg = (seg, v)=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  function setLang(l){ opts.lang = l; put('sofia_lang', l); paintSeg(segLang, l); segUser.style.display = l==='it+en' && !SpeechRec ? 'none' : l==='it+en' ? '' : 'none'; if(l==='it') setUserLang('it-IT'); }
  function setUserLang(l){ userLang = l; paintSeg(segUser, l); if(session){ session.userInputLang = l; try{ session.recognition?.stop(); }catch(e){} } }
  function setMode(m){ opts.mode = m; put('sofia_mode', m); paintSeg(segMode, m); scene.style.display = m==='roleplay' ? '' : 'none'; }
  function setScena(k){ opts.scena = k; put('sofia_scena', k); scene.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===k)); }
  segLang.querySelectorAll('button').forEach(b=>b.onclick = ()=>setLang(b.dataset.v));
  segUser.querySelectorAll('button').forEach(b=>b.onclick = ()=>setUserLang(b.dataset.v));
  segMode.querySelectorAll('button').forEach(b=>b.onclick = ()=>setMode(b.dataset.v));
  setLang(opts.lang); setUserLang('it-IT'); setMode(opts.mode); setScena(opts.scena);

  const statusEl = $(`<div class="tutor-status" aria-live="polite"></div>`);
  stage.appendChild(statusEl);
  const chatEl = $(`<div class="tutor-chat"></div>`);
  const emptyEl = $(`<div class="tutor-empty"><div class="andrea-av" role="img" aria-label="Andrea"></div>
    <div><b style="color:var(--text)">Ciao! Sono Andrea.</b><br>Tap the microphone and speak Italian, or write below.<br>Tap any word of mine to translate it or save it.</div></div>`);
  chatEl.appendChild(emptyEl);
  stage.appendChild(chatEl);

  function addRow(role){
    if(emptyEl.parentNode) emptyEl.remove();
    let bub;
    if(role==='andrea'){
      const row = $(`<div class="tutor-msg-row"><div class="andrea-av" aria-hidden="true"></div></div>`);
      bub = $(`<div class="tutor-fumetto"></div>`);
      row.appendChild(bub); chatEl.appendChild(row);
    } else {
      const wrap = $(`<div class="user-msg"><div class="who">You</div></div>`);
      bub = $(`<div class="user-bub"></div>`);
      wrap.appendChild(bub); chatEl.appendChild(wrap);
    }
    return bub;
  }
  function renderAndrea(bub, m){
    bub.textContent = '';
    if(m.pron){ const n = $(`<div class="tutor-note"></div>`); n.textContent = `🗣️ ${m.pron}`; bub.appendChild(n); }
    if(m.corr){ const n = $(`<div class="tutor-note corr"></div>`); n.textContent = `✏️ ${m.corr}`; bub.appendChild(n); }
    const it = soloItaliano(m.text);
    const aiuti = (m.text.match(/\[[^\]]*\]/g) || []).map(s=>s.slice(1,-1));
    const body = $(`<div lang="it"></div>`);
    if(m.sistema) body.textContent = m.text;
    else testoCliccabile(body, it, (el, w, prev)=>popParola(el, w, {prev, tag:['andrea']}));
    bub.appendChild(body);
    if(aiuti.length){ const h = $(`<div class="tutor-en"></div>`); h.textContent = '🇬🇧 ' + aiuti.join(' · '); bub.appendChild(h); }
    if(m.sistema) return;
    const tools = $(`<div class="tutor-tools"></div>`);
    const t = (lab, fn)=>{ const b = $(`<button class="tutor-tool" type="button"></button>`); b.textContent = lab; b.onclick = fn; tools.appendChild(b); return b; };
    t('🔁 Repeat', ()=>speakAs(it, 'A'));
    t('🐢 Slower', ()=>speakAs(it, 'A', null, 0.62));
    t('🔍 Explain', ()=>spiega(it, m.en || '', {tag:['andrea']}));
    const enDiv = $(`<div class="tutor-en" style="display:none"></div>`);
    if(m.en){
      enDiv.textContent = m.en;
      const b = t('🇬🇧 English', ()=>{ const vis = enDiv.style.display==='none'; enDiv.style.display = vis ? '' : 'none'; b.textContent = vis ? '🇬🇧 Hide' : '🇬🇧 English'; });
    }
    const sv = t('＋ Save', ()=>{ salvaFrase(it, m.en || '', {tema:'Andrea'}); sv.textContent = '✓ Saved'; sv.disabled = true; haptic(true); });
    if(fraseSalvata(it)){ sv.textContent = '✓ Saved'; sv.disabled = true; }
    bub.append(tools, enDiv);
  }
  function onMsg(m){
    if(m.role==='andrea'){
      const bub = addRow('andrea');
      renderAndrea(bub, m);
    } else {
      if(!userEl) userEl = addRow('user');
      userEl.textContent = m.text;
      if(m.final) userEl = null;
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  const STATUS = {
    connecting:"⏳ Connecting…", listening:"🎤 Listening… speak Italian", recording:"🎙️ I can hear you — go on",
    thinking:"🤔 Andrea is thinking…", speaking:"💬 Andrea is speaking…", error:"❌ Connection failed — check the API key", disconnected:""
  };
  const micWrap = $(`<div class="mic-wrap"></div>`);
  const micBtn = $(`<button class="mic-btn" type="button" aria-label="Talk to Andrea">${ic('mic')}</button>`);
  const micLabel = $(`<div class="mic-label">Tap to talk to Andrea</div>`);
  micWrap.append(micBtn, micLabel); stage.appendChild(micWrap);
  function onStatus(s){
    statusEl.textContent = session && session.textOnly && s==='listening' ? '⌨️ Your turn: write in Italian' : (STATUS[s] || "");
    const active = ['listening','speaking','recording','thinking'].includes(s), busy = s==='connecting';
    micBtn.innerHTML = active ? ic('stop') : ic('mic');
    micBtn.classList.toggle('on', active); micBtn.classList.toggle('busy', busy);
    micBtn.classList.toggle('mic-listening', s==='listening' || s==='recording');
    micBtn.setAttribute('aria-label', active ? 'End the conversation' : 'Talk to Andrea');
    micLabel.textContent = active ? 'Tap to end' : busy ? 'Connecting…' : 'Tap to talk to Andrea';
    if(s==='error'){ session = null; userEl = null; }
    if(s==='disconnected'){ if(session) sofiaSaveMem(session.history); session = null; userEl = null; }
  }
  function nuovaSessione(key){
    const s = new AndreaSession({apiKey:key, opts, onMsg, onStatus});
    s.userInputLang = userLang;
    return s;
  }
  const typeRow = $(`<div class="type-row"></div>`);
  const typeInp = $(`<input type="text" placeholder="…or write here" enterkeyhint="send" autocomplete="off" lang="it">`);
  const sendBtn = $(`<button class="btn blue" type="button" aria-label="Send">${ic('send')}</button>`);
  function sendTyped(){
    const t = typeInp.value.trim(); if(!t) return;
    const key = localStorage.getItem(SOFIA_KEY);
    if(!key){ showKeyModal(); return; }
    typeInp.value = "";
    if(session){ session.sendText(t); return; }
    session = nuovaSessione(key);
    session.textOnly = true;
    session.connect().then(()=>session && session.sendText(t)).catch(()=>onStatus("error"));
  }
  sendBtn.onclick = sendTyped;
  typeInp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); sendTyped(); } });
  typeRow.append(typeInp, sendBtn);
  stage.appendChild(typeRow);
  const acc = makeAccentKeys(typeInp);
  if(acc) stage.appendChild(acc);
  micBtn.onclick = ()=>{
    if(session){ session.disconnect(); return; }
    const key = localStorage.getItem(SOFIA_KEY);
    if(!key){ showKeyModal(); return; }
    session = nuovaSessione(key);
    session.connect().catch(()=>onStatus("error"));
  };
  const hasKey = !!localStorage.getItem(SOFIA_KEY);
  const keyEl = $(`<button class="textbtn" type="button" style="align-self:center">${ic('key')} <span>${hasKey ? "API key set · change" : "Set up your Gemini API key"}</span></button>`);
  keyEl.onclick = ()=>showKeyModal();
  stage.appendChild(keyEl);
  if(opts.lastSession){
    const nuovo = $(`<button class="textbtn" type="button" style="align-self:center">${ic('refresh')} Andrea remembers your last chat · start afresh</button>`);
    nuovo.onclick = ()=>{ try{ localStorage.removeItem(SOFIA_MEM); }catch(e){} opts.lastSession = ''; nuovo.remove(); toast('Andrea will start a new conversation'); };
    stage.appendChild(nuovo);
  }
  function showKeyModal(){
    const ov = $(`<div class="modal-ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Gemini API key">
        <h3>🔑 Gemini API key</h3>
        <p>Get a free key at <b>aistudio.google.com</b> → <b>Get API key</b>.<br>It is stored only on this device.</p>
        <input type="password" placeholder="Paste your API key…" autocomplete="off">
        <div class="row"><button class="btn" type="button" data-a="x">Cancel</button><button class="btn primary" type="button" data-a="ok">Save</button></div>
      </div></div>`);
    document.body.appendChild(ov);
    const inp = ov.querySelector("input");
    inp.value = localStorage.getItem(SOFIA_KEY) || "";
    const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown', onEsc);
    ov.onclick = e=>{ if(e.target===ov) close(); };
    ov.querySelector('[data-a="x"]').onclick = close;
    const save = ()=>{ const v = inp.value.trim(); if(v){ try{ localStorage.setItem(SOFIA_KEY, v); }catch(e){} keyEl.querySelector("span").textContent = "API key set · change"; } close(); };
    ov.querySelector('[data-a="ok"]').onclick = save;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
    setTimeout(()=>inp.focus(), 50);
  }
}

// =====================================================================
// BOOT: theme, skeleton, splash, content, service worker.
// =====================================================================
applyTheme();
if(darkMq && darkMq.addEventListener) darkMq.addEventListener('change', ()=>{ syncThemeColor(); aggiornaCielo(); });
aggiornaCielo();

function renderSkeleton(){
  app.innerHTML =
    `<div class="stage" style="gap:12px">`+
    `<div class="sk" style="height:56px;border-radius:16px;width:70%"></div>`+
    `<div class="sk" style="height:150px;border-radius:24px"></div>`+
    `<div class="sk" style="height:78px"></div>`+
    `<div class="grid">${'<div class="tile sk"></div>'.repeat(4)}</div></div>`;
}

// the splash disappears as soon as the content is ready (after at least a
// second, so it doesn't flash), or when tapped; in any case within 3 seconds
const _splash = document.getElementById('splash');
const _splashT0 = Date.now();
function hideSplash(immediato){
  if(!_splash || _splash.classList.contains('fade-out')) return;
  const wait = immediato ? 0 : Math.max(0, 1000 - (Date.now()-_splashT0));
  setTimeout(()=>{ _splash.classList.add('fade-out'); setTimeout(()=>_splash.remove(), 450); }, wait);
}
if(_splash) _splash.addEventListener('click', ()=>hideSplash(true));
setTimeout(()=>hideSplash(true), 3000);

// the dictionary, plus the words saved by the old version of the app, plus
// the words saved in My exercises that are not in the dictionary (from the
// tutor, the readings, the online search): all of them become flashcards
function montaVoci(db){
  const viste = new Set();
  const out = [];
  const add = v=>{ if(!v || !v.it || viste.has(v.id)) return; viste.add(v.id); out.push(v); };
  (db.dizionario||[]).forEach(add);
  (db.voci||[]).forEach(add);
  const chiavi = new Set(out.map(v=>normW(v.it)));
  const extra = [...(userStore().voci||[]), ...esesStore().voci].filter(v=>v && v.it && v.id && !chiavi.has(normW(v.it)));
  extra.forEach(v=>{ chiavi.add(normW(v.it)); add(Object.assign({pos:'', tag:[]}, v, {mia:true})); });
  return out;
}
renderSkeleton();
// no-cache = always revalidate with the server, but an unchanged file isn't
// downloaded again (304): faster start, less traffic
fetch("knowledge.json", {cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(db=>{
    db.voci = montaVoci(db);
    DB = db;
    renderHome(); hideSplash();
    const h = history.state;
    if(h && h.depth) history.replaceState({depth:0}, "");
  })
  .catch(e=>{
    console.error(e);
    hideSplash(true);
    app.innerHTML = `<div class="errbox"><div class="big">⚠️</div><p>The content couldn't be loaded.<br><span class="muted">Check your connection and try again.</span></p><button class="btn primary" type="button" onclick="location.reload()" style="max-width:220px">Try again</button><small>${esc(e)}</small></div>`;
  });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{});
}

</script>
